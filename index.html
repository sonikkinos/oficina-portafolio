<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Daniel Esteve - Escritorio Windows XP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <style>
    body {
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      font-family: 'Tahoma', 'Segoe UI', Geneva, Verdana, sans-serif;
    }
    
    .xp-window {
      box-shadow: 3px 3px 14px rgba(0,0,0,0.6);
      border: 3px solid #0055ea;
      border-radius: 8px 8px 0 0;
    }
    
    .xp-titlebar {
      background: linear-gradient(to bottom, #0058ee 0%, #388cf8 10%, #0055ea 88%, #0011bb 100%);
      border-top-left-radius: 5px;
      border-top-right-radius: 5px;
    }

    .xp-ctrl-btn {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      cursor: pointer;
      border: 1px solid #102a75;
      box-shadow: inset 1px 1px 1px rgba(255,255,255,0.7);
    }

    .xp-btn-min-max {
      background: linear-gradient(to bottom, #3c82f8 0%, #2968db 50%, #1748a8 100%);
    }
    .xp-btn-min-max:hover {
      background: linear-gradient(to bottom, #5093ff 0%, #3a7aff 50%, #2059c4 100%);
    }

    .xp-btn-close {
      background: linear-gradient(to bottom, #e25842 0%, #cc331a 50%, #991e0b 100%);
      border-color: #520b02;
    }
    .xp-btn-close:hover {
      background: linear-gradient(to bottom, #f06a54 0%, #e63e24 50%, #b3240f 100%);
    }

    .xp-taskbar {
      background: linear-gradient(to bottom, #1f2f86 0%, #3168d5 10%, #2557c6 90%, #1941a5 100%);
    }

    .xp-start-btn {
      background: linear-gradient(to bottom, #388e3c 0%, #4caf50 50%, #2e7d32 100%);
      box-shadow: inset 1px 1px 2px #a5d6a7, inset -1px -1px 2px #1b5e20;
    }

    .wmp8-bg { background: #091322; color: #c0d8f0; }
    .wmp8-sidebar-item {
      background: linear-gradient(to right, #1b3558 0%, #0d1e36 100%);
      border-bottom: 1px solid #091322;
      border-right: 2px solid #2d588c;
    }
    .wmp8-sidebar-item.active {
      background: linear-gradient(to right, #2b568f 0%, #173763 100%);
      color: #ffffff;
      font-weight: bold;
      border-right: 3px solid #00aaff;
    }
    .wmp8-controls-panel {
      background: linear-gradient(to bottom, #1e395e 0%, #0c182b 100%);
      border-top: 2px solid #2e5587;
    }
    .wmp8-play-btn {
      background: radial-gradient(circle at 35% 35%, #52c7ff 0%, #0066cc 60%, #002b5e 100%);
      border: 1px solid #73d2ff;
      box-shadow: 0 0 10px rgba(0, 170, 255, 0.6), inset 1px 1px 3px rgba(255, 255, 255, 0.8);
    }
    .wmp8-play-btn:hover {
      background: radial-gradient(circle at 35% 35%, #7ee0ff 0%, #0088ff 60%, #003a80 100%);
    }
    .wmp8-btn-metal {
      background: linear-gradient(to bottom, #4a6c99 0%, #213c61 50%, #132742 100%);
      border: 1px solid #5d85b8;
    }

    @keyframes floatClippy {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .clippy-animate { animation: floatClippy 2.5s ease-in-out infinite; }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-cover bg-center" style="background-image: url('https://upload.wikimedia.org/wikipedia/en/2/27/Bliss_%28Windows_XP%29.png');">
  <div id="root" class="h-full w-full"></div>

  <script>
    const e = React.createElement;
    const { useState, useRef, useEffect } = React;

    const ICONS = {

      recycleBin: 'https://win98icons.alexmeub.com/icons/png/recycle_bin_empty-4.png',
      notepad: 'https://win98icons.alexmeub.com/icons/png/notepad-5.png',
      folder: 'https://win98icons.alexmeub.com/icons/png/directory_closed-4.png',

      video: 'https://win98icons.alexmeub.com/icons/png/mmsys_114-0.png',
      mediaPlayer: 'https://win98icons.alexmeub.com/icons/png/mplayer-2.png'
    };

    const videosMaQasa = [
      { id: 1, title: 'MaQasa - Presentación 1.mp4', youtubeId: 'RF_x4QkbYAM' },
      { id: 2, title: 'MaQasa - Demostración 2.mp4', youtubeId: 'T9n1ccoLylo' },
      { id: 3, title: 'MaQasa - Proyecto 3.mp4', youtubeId: '2heu2DE75Ts' }
    ];

    const videosConcursos = [
      { id: 1, title: 'Concurso - Vídeo 1.mp4', youtubeId: 'oL0bPDxF02E' },
      { id: 2, title: 'Concurso - Vídeo 2.mp4', youtubeId: '_wBOTBJ44oE' }
    ];

    // REGISTRO DE ARCHIVOS CON RUTAS CODIFICADAS CORRECTAMENTE
    const mediaFiles = {
      'Proyectos Personales/Posters': [
        { name: 'Hasbulla Poster', src: './Proyectos%20Personales/Posters/Hasbulla%20Poster.jpg' },
        { name: 'Lollipop Poster', src: './Proyectos%20Personales/Posters/Lollipop%20Poster.png' },
        { name: 'Mi team Poster', src: './Proyectos%20Personales/Posters/Mi%20team%20Poster.png' },
        { name: 'Museo arte UA Poster', src: './Proyectos%20Personales/Posters/Museo%20arte%20UA%20Poster.png' },
        { name: 'Spiderman Poster', src: './Proyectos%20Personales/Posters/Spiderman%20Poster.png' },
        { name: 'Velazquez Poster', src: './Proyectos%20Personales/Posters/Velazquez%20Poster.png' }
      ],
      'Proyectos Personales/Merchandising': [
        { name: 'Alicantino Camiseta', src: './Proyectos%20Personales/Merchandising/Alicantino%20Camiseta.png' },
        { name: 'Cherubines Camiseta', src: './Proyectos%20Personales/Merchandising/Cherubines%20Camiseta.gif' },
        { name: 'Cruz Cafune Camiseta', src: './Proyectos%20Personales/Merchandising/Cruz%20Cafune%20Camiseta.gif' },
        { name: 'Flores Camiseta', src: './Proyectos%20Personales/Merchandising/Flores%20Camiseta.gif' },
        { name: 'YoInterneto Concurso', src: './Proyectos%20Personales/Merchandising/YoInterneto%20Concurso%20Camisetas.gif' }
      ],
      'Proyectos Personales/CD Covers': [
        { name: 'Alizzz - Amanecer', src: './Proyectos%20Personales/CD%20Covers/Alizzz%20-%20Amanecer%20CD.png' },
        { name: 'Feid - Videitoxx', src: './Proyectos%20Personales/CD%20Covers/Feid%20-%20Videitoxx.jpg' },
        { name: 'Gonzy - A mi lado', src: './Proyectos%20Personales/CD%20Covers/Gonzy%20-%20A%20mi%20lado.png' },
        { name: 'ID - Luna', src: './Proyectos%20Personales/CD%20Covers/ID%20-%20Luna.png' },
        { name: 'Juancho Marques - Paralelo', src: './Proyectos%20Personales/CD%20Covers/Juancho%20Marques%20-%20Paralelo%20Circular.png' },
        { name: 'Luck - Red flag', src: './Proyectos%20Personales/CD%20Covers/Luck%20-%20Red%20flag.jpg' },
        { name: 'Manu Cort - Baby tu me encantas', src: './Proyectos%20Personales/CD%20Covers/Manu%20Cort%20-%20Baby%20tu%20me%20encantas.jpg' },
        { name: 'Manu Cort - Sal', src: './Proyectos%20Personales/CD%20Covers/Manu%20Cort%20-%20Sal.png' }
      ],
      'Proyectos Personales/Branding': [
        { name: 'Cartel Bar Hivense', src: './Proyectos%20Personales/Branding/Cartel%20Bar%20Hivense.png' },
        { name: 'Cartel Hivense', src: './Proyectos%20Personales/Branding/Cartel%20Hivense.png' },
        { name: 'Logo hivense azul negativo', src: './Proyectos%20Personales/Branding/Logo%20hivense%20azul%20negativo.png' },
        { name: 'Logo hivense azul', src: './Proyectos%20Personales/Branding/Logo%20hivense%20azul.png' },
        { name: 'Servilletas Hivense', src: './Proyectos%20Personales/Branding/Servilletas%20Hivense.png' },
        { name: 'Totebag Hivense', src: './Proyectos%20Personales/Branding/Totebag%20Hivense.png' }
      ],
      'Proyectos Laborales/V3RTICE': [
        { name: 'Contenido AGE', src: './Proyectos%20Laborales/V3RTICE/Contenido%20AGE.gif' },
        { name: 'Contenido Turris', src: './Proyectos%20Laborales/V3RTICE/Contenido%20Turris.gif' }
      ],
      'Proyectos Laborales/Concurso': [
        { name: 'WWE campaña', src: './Proyectos%20Laborales/Concurso/WWE%20campa%C3%B1a.gif' },
        { name: 'Hogares sin techo', src: './Proyectos%20Laborales/Concurso/Hogares%20sin%20techo%20Campa%C3%B1a.gif' }
      ],
      'Proyectos Laborales/Concursos': [
        { name: 'WWE campaña', src: './Proyectos%20Laborales/Concurso/WWE%20campa%C3%B1a.gif' },
        { name: 'Hogares sin techo', src: './Proyectos%20Laborales/Concurso/Hogares%20sin%20techo%20Campa%C3%B1a.gif' }
      ]
    };

    const playlist = [
      { id: 1, title: 'Son De Amores', artist: 'Andy & Lucas', src: './Andy%20&%20Lucas%20-%20Son%20De%20Amores.mp3', duration: '03:40' },
      { id: 2, title: 'La Flaca', artist: 'Jarabe De Palo', src: './Jarabe%20De%20Palo%20-%20La%20Flaca.mp3', duration: '04:20' },
      { id: 3, title: 'Ven Bailalo', artist: 'Khriz y Angel', src: './Khriz%20y%20Angel%20-%20Ven%20Bailalo.mp3', duration: '03:15' },
      { id: 4, title: 'Princesas', artist: 'Pereza', src: './Pereza%20-%20Princesas.mp3', duration: '03:55' },
      { id: 5, title: 'Pa Que Retozen', artist: 'Tego Caldeon', src: './Tego%20Caldeon%20-%20Pa%20Que%20Retozen.mp3', duration: '03:30' }
    ];

    const HardDriveIcon = () => e('svg', { width: '32', height: '32', viewBox: '0 0 36 36', fill: 'none' },
      e('rect', { x: '4', y: '10', width: '28', height: '16', rx: '2', fill: '#94a3b8', stroke: '#334155', strokeWidth: '1.5' }),
      e('rect', { x: '6', y: '12', width: '24', height: '12', rx: '1', fill: '#cbd5e1' }),
      e('circle', { cx: '9', cy: '18', r: '1.5', fill: '#22c55e' }),
      e('rect', { x: '13', y: '16', width: '14', height: '4', fill: '#64748b', rx: '0.5' })
    );

    function MediaPlayer8App() {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [progress, setProgress] = useState(0);
      const [volume, setVolume] = useState(0.8);
      const [showPlaylist, setShowPlaylist] = useState(false);
      const audioRef = useRef(null);
      const currentTrack = playlist[currentIndex];

      useEffect(() => { if (audioRef.current) audioRef.current.volume = volume; }, [volume]);

      const togglePlay = () => {
        if (!audioRef.current) return;
        if (isPlaying) { audioRef.current.pause(); setIsPlaying(false); }
        else { audioRef.current.play().then(() => setIsPlaying(true)).catch(err => console.log(err)); }
      };

      return e('div', { className: 'wmp8-bg flex flex-col h-full w-full select-none text-xs font-sans overflow-hidden border border-slate-800' },
        e('audio', { ref: audioRef, src: currentTrack.src, onTimeUpdate: () => { if (audioRef.current) setProgress((audioRef.current.currentTime / (audioRef.current.duration || 1)) * 100); }, onEnded: () => setCurrentIndex((prev) => (prev + 1) % playlist.length) }),
        e('div', { className: 'flex flex-1 overflow-hidden relative' },
          e('div', { className: 'flex-1 bg-black p-4 flex flex-col justify-center items-center text-center' },
            e('div', { className: `w-20 h-20 rounded-full border-2 border-cyan-500/50 bg-radial flex items-center justify-center mb-2 ${isPlaying ? 'animate-spin' : ''}` }, '🎵'),
            e('p', { className: 'font-bold text-sm text-cyan-200' }, currentTrack.title),
            e('p', { className: 'text-xs text-blue-300' }, currentTrack.artist)
          )
        ),
        e('div', { className: 'wmp8-controls-panel p-2 flex flex-col gap-1.5' },
          e('div', { className: 'w-full bg-slate-900 h-2.5 rounded border border-blue-900 overflow-hidden' },
            e('div', { className: 'bg-gradient-to-r from-blue-500 to-cyan-300 h-full', style: { width: `${progress}%` } })
          ),
          e('div', { className: 'flex justify-center gap-2' },
            e('button', { onClick: togglePlay, className: 'px-4 py-1 rounded wmp8-play-btn text-white font-bold' }, isPlaying ? '❚❚ Pausa' : '► Reproducir')
          )
        )
      );
    }

    function PaintApp() {
      const canvasRef = useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }, []);
      return e('div', { className: 'flex flex-col h-full bg-slate-200 p-2 items-center justify-center' },
        e('canvas', { ref: canvasRef, width: 400, height: 250, className: 'bg-white border shadow-md' })
      );
    }

    function MinesweeperApp() {
      return e('div', { className: 'flex flex-col items-center justify-center h-full bg-slate-300 p-4 font-bold text-xs' }, 'Buscaminas Activo');
    }

    function App() {
      const isMobile = window.innerWidth <= 640;
      const [windows, setWindows] = useState({
        myComputer: { id: 'myComputer', title: 'Mi PC', iconSrc: ICONS.myComputer, isOpen: false, isMinimized: false, pos: { x: 20, y: 20 }, isMax: isMobile, zIndex: 10 },
        cv: { id: 'cv', title: 'Mi CV.txt - Bloc de notas', iconSrc: ICONS.notepad, isOpen: false, isMinimized: false, pos: { x: 40, y: 40 }, isMax: isMobile, zIndex: 10 },
        proyectosPersonales: { id: 'proyectosPersonales', title: 'Explorador - C:\\Proyectos Personales', iconSrc: ICONS.folder, isOpen: false, isMinimized: false, pos: { x: 60, y: 60 }, isMax: isMobile, zIndex: 10 },
        proyectosLaborales: { id: 'proyectosLaborales', title: 'Explorador - C:\\Proyectos Laborales', iconSrc: ICONS.folder, isOpen: false, isMinimized: false, pos: { x: 80, y: 80 }, isMax: isMobile, zIndex: 10 },
        paint: { id: 'paint', title: 'Paint', iconSrc: ICONS.paint, isOpen: false, isMinimized: false, pos: { x: 100, y: 100 }, isMax: isMobile, zIndex: 10 },
        minesweeper: { id: 'minesweeper', title: 'Buscaminas', iconSrc: ICONS.minesweeper, isOpen: false, isMinimized: false, pos: { x: 120, y: 120 }, isMax: false, zIndex: 10 },
        mediaPlayer: { id: 'mediaPlayer', title: 'Windows Media Player 8', iconSrc: ICONS.mediaPlayer, isOpen: false, isMinimized: false, pos: { x: 140, y: 140 }, isMax: isMobile, zIndex: 10 },
        rrss: { id: 'rrss', title: 'Internet Explorer', iconSrc: ICONS.internetExplorer, isOpen: false, isMinimized: false, pos: { x: 160, y: 160 }, isMax: isMobile, zIndex: 10 },
        contacto: { id: 'contacto', title: 'Contacto', iconSrc: null, isOpen: false, isMinimized: false, pos: { x: 180, y: 180 }, isMax: false, zIndex: 10 }
      });

      const [selectedVideo, setSelectedVideo] = useState(null);
      const [selectedImage, setSelectedImage] = useState(null);
      const [navPersonales, setNavPersonales] = useState([]);
      const [navLaborales, setNavLaborales] = useState([]);
      const [topZ, setTopZ] = useState(20);
      const [startMenuOpen, setStartMenuOpen] = useState(false);

      const openWindow = (id) => {
        const nextZ = topZ + 1;
        setTopZ(nextZ);
        setWindows(prev => ({ ...prev, [id]: { ...prev[id], isOpen: true, isMinimized: false, zIndex: nextZ } }));
      };

      const closeWindow = (id) => setWindows(prev => ({ ...prev, [id]: { ...prev[id], isOpen: false } }));

      const renderXPWindow = (winKey, children, widthClass = "w-[95vw] sm:w-[90vw] max-w-[720px]") => {
        const win = windows[winKey];
        if (!win.isOpen || win.isMinimized) return null;
        return e('div', {
          style: { top: `${win.pos.y}px`, left: `${win.pos.x}px`, zIndex: win.zIndex },
          className: `fixed xp-window bg-slate-100 flex flex-col overflow-hidden ${widthClass}`
        },
          e('div', { className: 'xp-titlebar text-white px-2 py-1 flex justify-between items-center font-bold text-xs' },
            e('span', {}, win.title),
            e('button', { onClick: () => closeWindow(winKey), className: 'xp-ctrl-btn xp-btn-close' }, '✕')
          ),
          e('div', { className: 'p-3 overflow-y-auto max-h-[70vh] text-xs' }, children)
        );
      };

      const currentPathKeyPersonales = `Proyectos Personales${navPersonales.length ? '/' + navPersonales.join('/') : ''}`;
      const currentPathKeyLaborales = `Proyectos Laborales${navLaborales.length ? '/' + navLaborales.join('/') : ''}`;

      return e('div', { className: 'h-full w-full relative overflow-hidden', onClick: () => setStartMenuOpen(false) },
        
        // ICONOS ESCRITORIO
        e('div', { className: 'p-3 flex flex-col gap-4 text-white text-xs select-none' },
          [
            { id: 'myComputer', label: 'Mi PC', icon: ICONS.myComputer },
            { id: 'cv', label: 'Mi CV.txt', icon: ICONS.notepad },
            { id: 'mediaPlayer', label: 'Media Player', icon: ICONS.mediaPlayer },
            { id: 'proyectosLaborales', label: 'Proyectos Laborales', icon: ICONS.folder },
            { id: 'proyectosPersonales', label: 'Proyectos Personales', icon: ICONS.folder }
          ].map(item =>
            e('div', { key: item.id, onClick: () => openWindow(item.id), className: 'flex items-center gap-2 cursor-pointer w-36 p-1 rounded hover:bg-blue-600/40' },
              e('img', { src: item.icon, className: 'w-8 h-8 pointer-events-none' }),
              e('span', { className: 'font-bold drop-shadow' }, item.label)
            )
          )
        ),

        renderXPWindow('mediaPlayer', e(MediaPlayer8App), "w-[90vw] max-w-[500px]"),

        // VENTANA PERSONALES
        renderXPWindow('proyectosPersonales',
          e('div', { className: 'space-y-3' },
            e('div', { className: 'bg-slate-200 p-2 border rounded flex items-center gap-2' },
              navPersonales.length > 0 && e('button', { onClick: () => setNavPersonales([]), className: 'bg-white border px-2 py-0.5 font-bold' }, '⬅ Atrás'),
              e('span', { className: 'font-mono' }, `C:\\${currentPathKeyPersonales}`)
            ),
            e('div', { className: 'bg-white p-3 border rounded min-h-[200px]' },
              navPersonales.length === 0 ? e('div', { className: 'grid grid-cols-2 sm:grid-cols-4 gap-3' },
                ['Branding', 'CD Covers', 'Merchandising', 'Posters'].map(folder =>
                  e('div', { key: folder, onClick: () => setNavPersonales([folder]), className: 'p-3 border rounded hover:bg-blue-50 cursor-pointer flex flex-col items-center text-center' },
                    e('img', { src: ICONS.folder, className: 'w-10 h-10 mb-1 pointer-events-none' }),
                    e('span', { className: 'font-bold' }, folder)
                  )
                )
              ) : e('div', { className: 'grid grid-cols-2 sm:grid-cols-3 gap-3' },
                (mediaFiles[currentPathKeyPersonales] || []).map((file, idx) =>
                  e('div', { key: idx, onClick: () => setSelectedImage(file.src), className: 'p-2 border rounded hover:bg-blue-50 cursor-pointer flex flex-col items-center text-center' },
                    e('div', { className: 'w-20 h-20 bg-slate-100 border rounded flex items-center justify-center overflow-hidden mb-1' },
                      e('img', { src: file.src, className: 'w-full h-full object-contain pointer-events-none' })
                    ),
                    e('span', { className: 'truncate text-[10px] font-bold w-full' }, file.name)
                  )
                )
              )
            )
          )
        ),

        // VENTANA LABORALES
        renderXPWindow('proyectosLaborales',
          e('div', { className: 'space-y-3' },
            e('div', { className: 'bg-slate-200 p-2 border rounded flex items-center gap-2' },
              navLaborales.length > 0 && e('button', { onClick: () => setNavLaborales([]), className: 'bg-white border px-2 py-0.5 font-bold' }, '⬅ Atrás'),
              e('span', { className: 'font-mono' }, `C:\\${currentPathKeyLaborales}`)
            ),
            e('div', { className: 'bg-white p-3 border rounded min-h-[200px]' },
              navLaborales.length === 0 ? e('div', { className: 'grid grid-cols-2 sm:grid-cols-3 gap-3' },
                ['Concursos', 'MaQasa', 'V3RTICE'].map(folder =>
                  e('div', { key: folder, onClick: () => setNavLaborales([folder]), className: 'p-3 border rounded hover:bg-blue-50 cursor-pointer flex flex-col items-center text-center' },
                    e('img', { src: ICONS.folder, className: 'w-10 h-10 mb-1 pointer-events-none' }),
                    e('span', { className: 'font-bold' }, folder)
                  )
                )
              ) : navLaborales[0] === 'MaQasa' ? e('div', { className: 'grid grid-cols-1 sm:grid-cols-3 gap-3' },
                videosMaQasa.map(v =>
                  e('div', { key: v.id, onClick: () => setSelectedVideo(v), className: 'p-2 border rounded hover:bg-blue-50 cursor-pointer flex flex-col items-center text-center' },
                    e('img', { src: ICONS.video, className: 'w-10 h-10 mb-1' }),
                    e('span', { className: 'font-bold text-xs' }, v.title)
                  )
                )
              ) : (navLaborales[0] === 'Concurso' || navLaborales[0] === 'Concursos') ? e('div', { className: 'space-y-3' },
                e('p', { className: 'font-bold text-slate-600 border-b pb-1' }, 'Vídeos de YouTube:'),
                e('div', { className: 'grid grid-cols-1 sm:grid-cols-2 gap-3 mb-3' },
                  videosConcursos.map(v =>
                    e('div', { key: v.id, onClick: () => setSelectedVideo(v), className: 'p-2 border rounded hover:bg-blue-50 cursor-pointer flex flex-col items-center text-center' },
                      e('img', { src: ICONS.video, className: 'w-10 h-10 mb-1' }),
                      e('span', { className: 'font-bold text-xs' }, v.title)
                    )
                  )
                ),
                e('p', { className: 'font-bold text-slate-600 border-b pb-1' }, 'GIFs y Campañas:'),
                e('div', { className: 'grid grid-cols-2 sm:grid-cols-3 gap-3' },
                  (mediaFiles['Proyectos Laborales/Concursos'] || mediaFiles['Proyectos Laborales/Concurso'] || []).map((file, idx) =>
                    e('div', { key: idx, onClick: () => setSelectedImage(file.src), className: 'p-2 border rounded hover:bg-blue-50 cursor-pointer flex flex-col items-center text-center' },
                      e('div', { className: 'w-20 h-20 bg-slate-100 border rounded flex items-center justify-center overflow-hidden mb-1' },
                        e('img', { src: file.src, className: 'w-full h-full object-contain pointer-events-none' })
                      ),
                      e('span', { className: 'truncate text-[10px] font-bold w-full' }, file.name)
                    )
                  )
                )
              ) : e('div', { className: 'grid grid-cols-2 sm:grid-cols-3 gap-3' },
                (mediaFiles['Proyectos Laborales/V3RTICE'] || []).map((file, idx) =>
                  e('div', { key: idx, onClick: () => setSelectedImage(file.src), className: 'p-2 border rounded hover:bg-blue-50 cursor-pointer flex flex-col items-center text-center' },
                    e('div', { className: 'w-20 h-20 bg-slate-100 border rounded flex items-center justify-center overflow-hidden mb-1' },
                      e('img', { src: file.src, className: 'w-full h-full object-contain pointer-events-none' })
                    ),
                    e('span', { className: 'truncate text-[10px] font-bold w-full' }, file.name)
                  )
                )
              )
            )
          )
        ),

        // VISOR VÍDEOS
        selectedVideo && e('div', { className: 'fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-3' },
          e('div', { className: 'xp-window bg-slate-100 w-full max-w-[400px] flex flex-col shadow-2xl' },
            e('div', { className: 'xp-titlebar text-white px-2 py-1 flex justify-between font-bold text-xs' },
              e('span', {}, selectedVideo.title),
              e('button', { onClick: () => setSelectedVideo(null), className: 'xp-ctrl-btn xp-btn-close' }, '✕')
            ),
            e('div', { className: 'p-2 bg-black' },
              e('iframe', { width: '100%', height: '300', src: `https://www.youtube.com/embed/${selectedVideo.youtubeId}?autoplay=1`, allowFullScreen: true, className: 'w-full rounded' })
            )
          )
        ),

        // VISOR IMÁGENES / GIFS
        selectedImage && e('div', { className: 'fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-3', onClick: () => setSelectedImage(null) },
          e('div', { className: 'xp-window bg-slate-100 max-w-[90vw] max-h-[85vh] p-2 flex flex-col items-center shadow-2xl', onClick: (evt) => evt.stopPropagation() },
            e('div', { className: 'xp-titlebar text-white px-2 py-1 w-full flex justify-between font-bold text-xs mb-2' },
              e('span', {}, 'Visor de imágenes'),
              e('button', { onClick: () => setSelectedImage(null), className: 'xp-ctrl-btn xp-btn-close' }, '✕')
            ),
            e('img', { src: selectedImage, className: 'max-w-full max-h-[70vh] rounded border shadow object-contain bg-black' })
          )
        ),

        // BARRA DE TAREAS
        e('footer', { className: 'fixed bottom-0 left-0 right-0 h-10 xp-taskbar flex justify-between items-center px-2 z-50 text-white text-xs' },
          e('span', { className: 'font-bold' }, '❖ Daniel Esteve - Portafolio'),
          e('span', {}, new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }))
        )
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(e(App));
  </script>
</body>
</html>
