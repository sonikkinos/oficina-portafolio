<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Daniel Esteve - Escritorio Windows XP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <style>
    body {
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      font-family: 'Tahoma', 'Segoe UI', Geneva, Verdana, sans-serif;
    }
    
    .xp-window {
      box-shadow: 3px 3px 14px rgba(0,0,0,0.6);
      border: 3px solid #0055ea;
      border-radius: 8px 8px 0 0;
    }
    
    .xp-titlebar {
      background: linear-gradient(to bottom, #0058ee 0%, #388cf8 10%, #0055ea 88%, #0011bb 100%);
      border-top-left-radius: 5px;
      border-top-right-radius: 5px;
    }

    .xp-ctrl-btn {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      cursor: pointer;
      border: 1px solid #102a75;
      box-shadow: inset 1px 1px 1px rgba(255,255,255,0.7);
    }

    .xp-btn-min-max {
      background: linear-gradient(to bottom, #3c82f8 0%, #2968db 50%, #1748a8 100%);
    }
    .xp-btn-min-max:hover {
      background: linear-gradient(to bottom, #5093ff 0%, #3a7aff 50%, #2059c4 100%);
    }

    .xp-btn-close {
      background: linear-gradient(to bottom, #e25842 0%, #cc331a 50%, #991e0b 100%);
      border-color: #520b02;
    }
    .xp-btn-close:hover {
      background: linear-gradient(to bottom, #f06a54 0%, #e63e24 50%, #b3240f 100%);
    }

    .xp-taskbar {
      background: linear-gradient(to bottom, #1f2f86 0%, #3168d5 10%, #2557c6 90%, #1941a5 100%);
    }

    .xp-start-btn {
      background: linear-gradient(to bottom, #388e3c 0%, #4caf50 50%, #2e7d32 100%);
      box-shadow: inset 1px 1px 2px #a5d6a7, inset -1px -1px 2px #1b5e20;
    }

    .wmp8-bg { background: #091322; color: #c0d8f0; }
    .wmp8-sidebar-item {
      background: linear-gradient(to right, #1b3558 0%, #0d1e36 100%);
      border-bottom: 1px solid #091322;
      border-right: 2px solid #2d588c;
    }
    .wmp8-sidebar-item.active {
      background: linear-gradient(to right, #2b568f 0%, #173763 100%);
      color: #ffffff;
      font-weight: bold;
      border-right: 3px solid #00aaff;
    }
    .wmp8-controls-panel {
      background: linear-gradient(to bottom, #1e395e 0%, #0c182b 100%);
      border-top: 2px solid #2e5587;
    }
    .wmp8-play-btn {
      background: radial-gradient(circle at 35% 35%, #52c7ff 0%, #0066cc 60%, #002b5e 100%);
      border: 1px solid #73d2ff;
      box-shadow: 0 0 10px rgba(0, 170, 255, 0.6), inset 1px 1px 3px rgba(255, 255, 255, 0.8);
    }
    .wmp8-play-btn:hover {
      background: radial-gradient(circle at 35% 35%, #7ee0ff 0%, #0088ff 60%, #003a80 100%);
    }
    .wmp8-btn-metal {
      background: linear-gradient(to bottom, #4a6c99 0%, #213c61 50%, #132742 100%);
      border: 1px solid #5d85b8;
      box-shadow: inset 1px 1px 1px rgba(255, 255, 255, 0.4);
    }

    @keyframes floatClippy {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .clippy-animate { animation: floatClippy 2.5s ease-in-out infinite; }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-cover bg-center" style="background-image: url('https://upload.wikimedia.org/wikipedia/en/2/27/Bliss_%28Windows_XP%29.png');">
  <div id="root" class="h-full w-full"></div>

  <script>
    const e = React.createElement;
    const { useState, useRef, useEffect } = React;

    const ICONS = {
      myComputer: 'https://win98icons.alexmeub.com/icons/png/computer_explorer-4.png',
      recycleBin: 'https://win98icons.alexmeub.com/icons/png/recycle_bin_empty-4.png',
      notepad: 'https://win98icons.alexmeub.com/icons/png/notepad-5.png',
      folder: 'https://win98icons.alexmeub.com/icons/png/directory_closed-4.png',
      internetExplorer: 'https://win98icons.alexmeub.com/icons/png/msie1-4.png',
      paint: 'https://win98icons.alexmeub.com/icons/png/paint_file-2.png',
      minesweeper: 'https://win98icons.alexmeub.com/icons/png/game_mine_1-0.png',
      video: 'https://win98icons.alexmeub.com/icons/png/mmsys_114-0.png',
      mediaPlayer: 'https://win98icons.alexmeub.com/icons/png/mplayer-2.png',
      image: 'https://win98icons.alexmeub.com/icons/png/camera-2.png'
    };

    // VÍDEOS DE YOUTUBE
    const videosMaQasa = [
      { id: 1, title: 'MaQasa - Presentación 1.mp4', youtubeId: 'RF_x4QkbYAM' },
      { id: 2, title: 'MaQasa - Demostración 2.mp4', youtubeId: 'T9n1ccoLylo' },
      { id: 3, title: 'MaQasa - Proyecto 3.mp4', youtubeId: '2heu2DE75Ts' }
    ];

    const videosConcursos = [
      { id: 1, title: 'Concurso - Vídeo 1.mp4', youtubeId: 'oL0bPDxF02E' },
      { id: 2, title: 'Concurso - Vídeo 2.mp4', youtubeId: '_wBOTBJ44oE' }
    ];

    // REGISTRO DE ARCHIVOS MULTIMEDIA POR CARPETA (RUTAS EXACTAS EN GITHUB)
    const mediaFiles = {
      'Proyectos Personales/Posters': [
        { name: 'Hasbulla Poster', src: './Proyectos Personales/Posters/Hasbulla Poster.jpg' },
        { name: 'Lollipop Poster', src: './Proyectos Personales/Posters/Lollipop Poster.png' },
        { name: 'Mi team Poster', src: './Proyectos Personales/Posters/Mi team Poster.png' },
        { name: 'Museo arte UA Poster', src: './Proyectos Personales/Posters/Museo arte UA Poster.png' },
        { name: 'Spiderman Poster', src: './Proyectos Personales/Posters/Spiderman Poster.png' },
        { name: 'Velazquez Poster', src: './Proyectos Personales/Posters/Velazquez Poster.png' }
      ],
      'Proyectos Personales/Merchandising': [
        { name: 'Alicantino Camiseta', src: './Proyectos Personales/Merchandising/Alicantino Camiseta.png' },
        { name: 'Cherubines Camiseta', src: './Proyectos Personales/Merchandising/Cherubines Camiseta.gif' },
        { name: 'Cruz Cafune Camiseta', src: './Proyectos Personales/Merchandising/Cruz Cafune Camiseta.gif' },
        { name: 'Flores Camiseta', src: './Proyectos Personales/Merchandising/Flores Camiseta.gif' },
        { name: 'YoInterneto Concurso', src: './Proyectos Personales/Merchandising/YoInterneto Concurso Camisetas.gif' }
      ],
      'Proyectos Personales/CD Covers': [
        { name: 'Alizzz - Amanecer', src: './Proyectos Personales/CD Covers/Alizzz - Amanecer CD.png' },
        { name: 'Feid - Videitoxx', src: './Proyectos Personales/CD Covers/Feid - Videitoxx.jpg' },
        { name: 'Gonzy - A mi lado', src: './Proyectos Personales/CD Covers/Gonzy - A mi lado.png' },
        { name: 'ID - Luna', src: './Proyectos Personales/CD Covers/ID - Luna.png' },
        { name: 'Juancho Marques - Paralelo', src: './Proyectos Personales/CD Covers/Juancho Marques - Paralelo Circular.png' },
        { name: 'Luck - Red flag', src: './Proyectos Personales/CD Covers/Luck - Red flag.jpg' },
        { name: 'Manu Cort - Baby tu me encantas', src: './Proyectos Personales/CD Covers/Manu Cort - Baby tu me encantas.jpg' },
        { name: 'Manu Cort - Sal', src: './Proyectos Personales/CD Covers/Manu Cort - Sal.png' }
      ],
      'Proyectos Personales/Branding': [
        { name: 'Cartel Bar Hivense', src: './Proyectos Personales/Branding/Cartel Bar Hivense.png' },
        { name: 'Cartel Hivense', src: './Proyectos Personales/Branding/Cartel Hivense.png' },
        { name: 'Logo hivense azul negativo', src: './Proyectos Personales/Branding/Logo hivense azul negativo.png' },
        { name: 'Logo hivense azul', src: './Proyectos Personales/Branding/Logo hivense azul.png' },
        { name: 'Servilletas Hivense', src: './Proyectos Personales/Branding/Servilletas Hivense.png' },
        { name: 'Totebag Hivense', src: './Proyectos Personales/Branding/Totebag Hivense.png' }
      ],
      'Proyectos Laborales/V3RTICE': [
        { name: 'Contenido AGE', src: './Proyectos Laborales/V3RTICE/Contenido AGE.gif' },
        { name: 'Contenido Turris', src: './Proyectos Laborales/V3RTICE/Contenido Turris.gif' }
      ],
      'Proyectos Laborales/Concurso': [
        { name: 'WWE campaña', src: './Proyectos Laborales/Concurso/WWE campaña.gif' },
        { name: 'Hogares sin techo', src: './Proyectos Laborales/Concurso/Hogares sin techo Campaña.gif' }
      ]
    };

    // PLAYLIST MÚSICA
    const playlist = [
      { id: 1, title: 'Son De Amores', artist: 'Andy & Lucas', src: './Andy & Lucas - Son De Amores.mp3', duration: '03:40' },
      { id: 2, title: 'La Flaca', artist: 'Jarabe De Palo', src: './Jarabe De Palo - La Flaca.mp3', duration: '04:20' },
      { id: 3, title: 'Ven Bailalo', artist: 'Khriz y Angel', src: './Khriz y Angel - Ven Bailalo.mp3', duration: '03:15' },
      { id: 4, title: 'Princesas', artist: 'Pereza', src: './Pereza - Princesas.mp3', duration: '03:55' },
      { id: 5, title: 'Pa Que Retozen', artist: 'Tego Caldeon', src: './Tego Caldeon - Pa Que Retozen.mp3', duration: '03:30' }
    ];

    const HardDriveIcon = () => e('svg', { width: '32', height: '32', viewBox: '0 0 36 36', fill: 'none' },
      e('rect', { x: '4', y: '10', width: '28', height: '16', rx: '2', fill: '#94a3b8', stroke: '#334155', strokeWidth: '1.5' }),
      e('rect', { x: '6', y: '12', width: '24', height: '12', rx: '1', fill: '#cbd5e1' }),
      e('circle', { cx: '9', cy: '18', r: '1.5', fill: '#22c55e' }),
      e('rect', { x: '13', y: '16', width: '14', height: '4', fill: '#64748b', rx: '0.5' })
    );

    function MediaPlayer8App() {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [progress, setProgress] = useState(0);
      const [volume, setVolume] = useState(0.8);
      const [showPlaylist, setShowPlaylist] = useState(false);
      const audioRef = useRef(null);

      const currentTrack = playlist[currentIndex];

      useEffect(() => { if (audioRef.current) audioRef.current.volume = volume; }, [volume]);

      const togglePlay = () => {
        if (!audioRef.current) return;
        if (isPlaying) { audioRef.current.pause(); setIsPlaying(false); }
        else { audioRef.current.play().then(() => setIsPlaying(true)).catch(err => console.log(err)); }
      };

      const stopPlay = () => {
        if (!audioRef.current) return;
        audioRef.current.pause(); audioRef.current.currentTime = 0; setIsPlaying(false); setProgress(0);
      };

      const handleTimeUpdate = () => {
        if (audioRef.current) setProgress((audioRef.current.currentTime / (audioRef.current.duration || 1)) * 100);
      };

      const nextTrack = () => { setCurrentIndex((prev) => (prev + 1) % playlist.length); setIsPlaying(false); setProgress(0); };
      const prevTrack = () => { setCurrentIndex((prev) => (prev - 1 + playlist.length) % playlist.length); setIsPlaying(false); setProgress(0); };

      return e('div', { className: 'wmp8-bg flex flex-col h-full w-full select-none text-xs font-sans overflow-hidden border border-slate-800' },
        e('audio', { ref: audioRef, src: currentTrack.src, onTimeUpdate: handleTimeUpdate, onEnded: nextTrack }),
        e('div', { className: 'flex flex-1 overflow-hidden relative' },
          e('div', { className: 'hidden sm:flex w-32 sm:w-36 flex-col shrink-0 text-[11px]' },
            ['Now Playing', 'Media Guide', 'Copy from CD', 'Media Library', 'Radio Tuner', 'Skin Chooser'].map((label, i) =>
              e('div', { key: i, className: `wmp8-sidebar-item p-2 flex items-center gap-2 ${i === 0 ? 'active' : ''}` }, label)
            )
          ),
          e('div', { className: 'flex-1 flex flex-col sm:flex-row bg-black overflow-hidden relative' },
            e('div', { className: 'flex-1 bg-gradient-to-b from-blue-950/40 via-black to-slate-950 p-2.5 flex flex-col justify-between items-center relative' },
              e('div', { className: 'w-full flex justify-between items-center text-[10px] text-cyan-400 font-mono z-10' },
                e('span', {}, 'WMP v8.0'),
                e('button', { onClick: () => setShowPlaylist(!showPlaylist), className: 'bg-blue-900/80 text-cyan-200 px-2 py-1 rounded border border-blue-600 text-[10px]' }, showPlaylist ? '✕ Cerrar' : '📂 Playlist')
              ),
              e('div', { className: 'my-auto flex flex-col items-center text-center z-10 w-full' },
                e('div', { className: 'w-20 h-20 sm:w-28 sm:h-28 rounded-full border-2 border-cyan-500/50 bg-radial from-cyan-900 via-blue-950 to-black flex items-center justify-center mb-2' },
                  e('span', { className: `text-xl sm:text-2xl ${isPlaying ? 'animate-spin' : ''}` }, '🎵')
                ),
                e('p', { className: 'font-bold text-xs sm:text-base text-cyan-200 truncate' }, currentTrack.title),
                e('p', { className: 'text-[11px] text-blue-300/80 mt-0.5' }, currentTrack.artist)
              )
            ),
            showPlaylist && e('div', { className: 'absolute inset-0 sm:relative sm:w-52 bg-slate-950/95 p-2 overflow-y-auto flex flex-col z-20' },
              playlist.map((track, idx) =>
                e('div', { key: track.id, onClick: () => { setCurrentIndex(idx); setIsPlaying(false); setProgress(0); setShowPlaylist(false); }, className: `p-2 rounded cursor-pointer text-[11px] mb-1 ${idx === currentIndex ? 'bg-blue-900 text-cyan-200 font-bold' : 'text-slate-300'}` },
                  `${idx + 1}. ${track.title}`
                )
              )
            )
          )
        ),
        e('div', { className: 'wmp8-controls-panel p-2 flex flex-col gap-1.5' },
          e('div', { className: 'w-full bg-slate-900 h-2.5 rounded border border-blue-900 overflow-hidden' },
            e('div', { className: 'bg-gradient-to-r from-blue-500 to-cyan-300 h-full', style: { width: `${progress}%` } })
          ),
          e('div', { className: 'flex items-center justify-between gap-2' },
            e('div', { className: 'flex items-center gap-1.5' },
              e('button', { onClick: togglePlay, className: 'w-10 h-10 rounded-full wmp8-play-btn text-white font-bold' }, isPlaying ? '❚❚' : '►'),
              e('button', { onClick: stopPlay, className: 'w-8 h-8 rounded-full wmp8-btn-metal text-white' }, '◼'),
              e('button', { onClick: prevTrack, className: 'w-8 h-8 rounded-full wmp8-btn-metal text-white' }, '⏮'),
              e('button', { onClick: nextTrack, className: 'w-8 h-8 rounded-full wmp8-btn-metal text-white' }, '⏭')
            ),
            e('div', { className: 'flex items-center gap-1 bg-black/40 px-2 py-1 rounded-full' },
              e('span', {}, '🔊'),
              e('input', { type: 'range', min: '0', max: '1', step: '0.05', value: volume, onChange: (evt) => setVolume(parseFloat(evt.target.value)), className: 'w-20 accent-cyan-400' })
            )
          )
        )
      );
    }

    function App() {
      const isMobile = window.innerWidth <= 640;
      const [windows, setWindows] = useState({
        myComputer: { id: 'myComputer', title: 'Mi PC', iconSrc: ICONS.myComputer, isOpen: false, isMinimized: false, pos: { x: 10, y: 20 }, isMax: isMobile, zIndex: 10 },
        cv: { id: 'cv', title: 'Mi CV.txt - Bloc de notas', iconSrc: ICONS.notepad, isOpen: false, isMinimized: false, pos: { x: 10, y: 20 }, isMax: isMobile, zIndex: 10 },
        proyectosPersonales: { id: 'proyectosPersonales', title: 'Explorador - C:\\Proyectos Personales', iconSrc: ICONS.folder, isOpen: false, isMinimized: false, pos: { x: 10, y: 20 }, isMax: isMobile, zIndex: 10 },
        proyectosLaborales: { id: 'proyectosLaborales', title: 'Explorador - C:\\Proyectos Laborales', iconSrc: ICONS.folder, isOpen: false, isMinimized: false, pos: { x: 10, y: 20 }, isMax: isMobile, zIndex: 10 },
        paint: { id: 'paint', title: 'sin título - Paint', iconSrc: ICONS.paint, isOpen: false, isMinimized: false, pos: { x: 10, y: 20 }, isMax: isMobile, zIndex: 10 },
        minesweeper: { id: 'minesweeper', title: 'Buscaminas', iconSrc: ICONS.minesweeper, isOpen: false, isMinimized: false, pos: { x: 10, y: 20 }, isMax: false, zIndex: 10 },
        mediaPlayer: { id: 'mediaPlayer', title: 'Windows Media Player 8', iconSrc: ICONS.mediaPlayer, isOpen: false, isMinimized: false, pos: { x: 10, y: 20 }, isMax: isMobile, zIndex: 10 },
        rrss: { id: 'rrss', title: 'Internet Explorer - Redes Sociales', iconSrc: ICONS.internetExplorer, isOpen: false, isMinimized: false, pos: { x: 10, y: 20 }, isMax: isMobile, zIndex: 10 },
        contacto: { id: 'contacto', title: 'Asistente - Datos de Contacto', iconSrc: null, isOpen: false, isMinimized: false, pos: { x: 10, y: 20 }, isMax: false, zIndex: 10 }
      });

      const [selectedVideo, setSelectedVideo] = useState(null);
      const [selectedImage, setSelectedImage] = useState(null);

      const [navPersonales, setNavPersonales] = useState([]);
      const [navLaborales, setNavLaborales] = useState([]);

      const basePersonalesFolders = ['Branding', 'CD Covers', 'Merchandising', 'Posters'];
      const baseLaboralesFolders = ['Concurso', 'MaQasa', 'V3RTICE'];

      const [activeWin, setActiveWin] = useState(null);
      const [topZ, setTopZ] = useState(20);
      const [startMenuOpen, setStartMenuOpen] = useState(false);

      const openWindow = (id) => {
        const nextZ = topZ + 1;
        setTopZ(nextZ);
        setWindows(prev => ({ ...prev, [id]: { ...prev[id], isOpen: true, isMinimized: false, zIndex: nextZ } }));
        setActiveWin(id);
      };

      const closeWindow = (id) => setWindows(prev => ({ ...prev, [id]: { ...prev[id], isOpen: false } }));
      const focusWindow = (id) => {
        const nextZ = topZ + 1;
        setTopZ(nextZ);
        setWindows(prev => ({ ...prev, [id]: { ...prev[id], isMinimized: false, zIndex: nextZ } }));
        setActiveWin(id);
      };

      const renderXPWindow = (winKey, children, widthClass = "w-[95vw] sm:w-[90vw] max-w-[720px]") => {
        const win = windows[winKey];
        if (!win.isOpen || win.isMinimized) return null;
        const style = win.isMax
          ? { top: 0, left: 0, width: '100vw', height: 'calc(100vh - 40px)', zIndex: win.zIndex }
          : { top: `${win.pos.y}px`, left: `${win.pos.x}px`, zIndex: win.zIndex };

        return e('div', { style, onClick: () => focusWindow(winKey), className: `fixed xp-window bg-slate-100 flex flex-col overflow-hidden ${win.isMax ? 'h-[calc(100vh-40px)] w-full' : widthClass}` },
          e('div', { className: 'xp-titlebar text-white px-2 py-1 flex justify-between items-center font-bold text-xs select-none' },
            e('span', {}, win.title),
            e('button', { onClick: () => closeWindow(winKey), className: 'xp-ctrl-btn xp-btn-close' }, '✕')
          ),
          e('div', { className: 'p-2 sm:p-3 overflow-y-auto flex-1 text-slate-900 text-xs' }, children)
        );
      };

      const currentPathKeyPersonales = `Proyectos Personales${navPersonales.length ? '/' + navPersonales.join('/') : ''}`;
      const currentPathKeyLaborales = `Proyectos Laborales${navLaborales.length ? '/' + navLaborales.join('/') : ''}`;

      return e('div', { className: 'h-full w-full relative overflow-hidden', onClick: () => setStartMenuOpen(false) },
        
        // ICONOS ESCRITORIO
        e('div', { className: 'p-3 flex flex-col gap-4 text-white text-xs select-none' },
          [
            { id: 'myComputer', label: 'Mi PC', icon: ICONS.myComputer },
            { id: 'cv', label: 'Mi CV.txt', icon: ICONS.notepad },
            { id: 'mediaPlayer', label: 'Media Player', icon: ICONS.mediaPlayer },
            { id: 'proyectosLaborales', label: 'Proyectos Laborales', icon: ICONS.folder },
            { id: 'proyectosPersonales', label: 'Proyectos Personales', icon: ICONS.folder },
            { id: 'rrss', label: 'RRSS', icon: ICONS.internetExplorer }
          ].map(item =>
            e('div', { key: item.id, onClick: () => openWindow(item.id), className: 'flex items-center gap-2 cursor-pointer w-32 p-1 rounded hover:bg-blue-600/40' },
              e('img', { src: item.icon, className: 'w-8 h-8' }),
              e('span', { className: 'font-bold drop-shadow' }, item.label)
            )
          )
        ),

        renderXPWindow('mediaPlayer', e(MediaPlayer8App), "w-[95vw] sm:w-[90vw] max-w-[620px]"),

        // VENTANA PROYECTOS PERSONALES
        renderXPWindow('proyectosPersonales',
          e('div', { className: 'space-y-3' },
            e('div', { className: 'bg-slate-200 p-2 border rounded flex items-center gap-2' },
              navPersonales.length > 0 && e('button', { onClick: () => setNavPersonales(prev => prev.slice(0, -1)), className: 'bg-white border px-2 py-0.5 font-bold' }, '⬅ Atrás'),
              e('span', { className: 'font-mono truncate' }, `C:\\${currentPathKeyPersonales}`)
            ),
            e('div', { className: 'bg-white p-3 border rounded min-h-[220px]' },
              navPersonales.length === 0 ? e('div', { className: 'grid grid-cols-2 sm:grid-cols-4 gap-3' },
                basePersonalesFolders.map(folder =>
                  e('div', { key: folder, onClick: () => setNavPersonales([folder]), className: 'p-3 border rounded hover:bg-blue-50 cursor-pointer flex flex-col items-center text-center' },
                    e('img', { src: ICONS.folder, className: 'w-10 h-10 mb-1' }),
                    e('span', { className: 'font-bold' }, folder)
                  )
                )
              ) : e('div', { className: 'grid grid-cols-2 sm:grid-cols-3 gap-3' },
                (mediaFiles[currentPathKeyPersonales] || []).map((file, idx) =>
                  e('div', { key: idx, onClick: () => setSelectedImage(file.src), className: 'p-2 border rounded hover:bg-blue-50 cursor-pointer flex flex-col items-center text-center' },
                    e('img', { src: file.src, className: 'w-16 h-16 object-cover rounded mb-1 border shadow-xs' }),
                    e('span', { className: 'truncate text-[10px] font-bold w-full' }, file.name)
                  )
                )
              )
            )
          )
        ),

        // VENTANA PROYECTOS LABORALES
        renderXPWindow('proyectosLaborales',
          e('div', { className: 'space-y-3' },
            e('div', { className: 'bg-slate-200 p-2 border rounded flex items-center gap-2' },
              navLaborales.length > 0 && e('button', { onClick: () => setNavLaborales(prev => prev.slice(0, -1)), className: 'bg-white border px-2 py-0.5 font-bold' }, '⬅ Atrás'),
              e('span', { className: 'font-mono truncate' }, `C:\\${currentPathKeyLaborales}`)
            ),
            e('div', { className: 'bg-white p-3 border rounded min-h-[240px]' },
              navLaborales.length === 0 ? e('div', { className: 'grid grid-cols-2 sm:grid-cols-3 gap-3' },
                baseLaboralesFolders.map(folder =>
                  e('div', { key: folder, onClick: () => setNavLaborales([folder]), className: 'p-3 border rounded hover:bg-blue-50 cursor-pointer flex flex-col items-center text-center' },
                    e('img', { src: ICONS.folder, className: 'w-10 h-10 mb-1' }),
                    e('span', { className: 'font-bold' }, folder)
                  )
                )
              ) : navLaborales[0] === 'MaQasa' ? e('div', { className: 'grid grid-cols-1 sm:grid-cols-3 gap-3' },
                videosMaQasa.map(v =>
                  e('div', { key: v.id, onClick: () => setSelectedVideo(v), className: 'p-2 border rounded hover:bg-blue-50 cursor-pointer flex flex-col items-center text-center' },
                    e('img', { src: ICONS.video, className: 'w-10 h-10 mb-1' }),
                    e('span', { className: 'font-bold text-xs truncate w-full' }, v.title)
                  )
                )
              ) : navLaborales[0] === 'Concurso' ? e('div', { className: 'grid grid-cols-1 sm:grid-cols-2 gap-3' },
                videosConcursos.map(v =>
                  e('div', { key: v.id, onClick: () => setSelectedVideo(v), className: 'p-2 border rounded hover:bg-blue-50 cursor-pointer flex flex-col items-center text-center' },
                    e('img', { src: ICONS.video, className: 'w-10 h-10 mb-1' }),
                    e('span', { className: 'font-bold text-xs truncate w-full' }, v.title)
                  )
                ),
                (mediaFiles[currentPathKeyLaborales] || []).map((file, idx) =>
                  e('div', { key: idx, onClick: () => setSelectedImage(file.src), className: 'p-2 border rounded hover:bg-blue-50 cursor-pointer flex flex-col items-center text-center' },
                    e('img', { src: file.src, className: 'w-16 h-16 object-cover rounded mb-1 border shadow-xs' }),
                    e('span', { className: 'truncate text-[10px] font-bold w-full' }, file.name)
                  )
                )
              ) : e('div', { className: 'grid grid-cols-2 sm:grid-cols-3 gap-3' },
                (mediaFiles[currentPathKeyLaborales] || []).map((file, idx) =>
                  e('div', { key: idx, onClick: () => setSelectedImage(file.src), className: 'p-2 border rounded hover:bg-blue-50 cursor-pointer flex flex-col items-center text-center' },
                    e('img', { src: file.src, className: 'w-16 h-16 object-cover rounded mb-1 border shadow-xs' }),
                    e('span', { className: 'truncate text-[10px] font-bold w-full' }, file.name)
                  )
                )
              )
            )
          )
        ),

        // VISOR DE VÍDEOS FLOTANTE
        selectedVideo && e('div', { className: 'fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-3' },
          e('div', { className: 'xp-window bg-slate-100 w-full max-w-[400px] flex flex-col overflow-hidden shadow-2xl' },
            e('div', { className: 'xp-titlebar text-white px-2 py-1 flex justify-between font-bold text-xs' },
              e('span', {}, selectedVideo.title),
              e('button', { onClick: () => setSelectedVideo(null), className: 'xp-ctrl-btn xp-btn-close' }, '✕')
            ),
            e('div', { className: 'p-2 bg-black' },
              e('iframe', { width: '100%', height: '400', src: `https://www.youtube.com/embed/${selectedVideo.youtubeId}?autoplay=1`, allowFullScreen: true, className: 'w-full rounded' })
            )
          )
        ),

        // VISOR DE IMÁGENES / GIFS FLOTANTE
        selectedImage && e('div', { className: 'fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-3', onClick: () => setSelectedImage(null) },
          e('div', { className: 'xp-window bg-slate-100 max-w-[90vw] max-h-[85vh] p-2 flex flex-col items-center shadow-2xl', onClick: (evt) => evt.stopPropagation() },
            e('div', { className: 'xp-titlebar text-white px-2 py-1 w-full flex justify-between font-bold text-xs mb-2' },
              e('span', {}, 'Visor de imágenes de Windows XP'),
              e('button', { onClick: () => setSelectedImage(null), className: 'xp-ctrl-btn xp-btn-close' }, '✕')
            ),
            e('img', { src: selectedImage, className: 'max-w-full max-h-[70vh] rounded border shadow' })
          )
        ),

        // BARRA DE TAREAS
        e('footer', { className: 'fixed bottom-0 left-0 right-0 h-10 xp-taskbar flex justify-between items-center px-1 z-50' },
          e('button', { onClick: () => openWindow('myComputer'), className: 'xp-start-btn text-white font-extrabold italic text-sm px-3 h-8 rounded-r-lg flex items-center gap-1 shadow-md' },
            e('span', {}, '❖ inicio')
          ),
          e('div', { className: 'text-white text-xs px-3 font-mono' }, new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }))
        )
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(e(App));
  </script>
</body>
</html>
