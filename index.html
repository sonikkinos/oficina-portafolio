<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daniel Esteve - Portafolio Creativo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">
  <div id="root"></div>

  <script>
    const e = React.createElement;
    const { useState } = React;

    function App() {
      const [dossierAbierto, setDossierAbierto] = useState(null);

      return e('div', { className: 'min-h-screen bg-amber-950/30 p-6 flex flex-col items-center justify-center font-sans' },
        // Encabezado
        e('header', { className: 'text-center mb-8' },
          e('h1', { className: 'text-3xl md:text-4xl font-extrabold text-amber-100 mb-2' }, 'Mesa de Trabajo — Daniel Esteve'),
          e('p', { className: 'text-amber-200/80 text-sm' }, 'Especialista en Marketing 360, Audiovisual y Ventas')
        ),

        // Contenedor principal / Escritorio
        e('main', { className: 'grid grid-cols-1 md:grid-cols-3 gap-6 max-w-4xl w-full bg-amber-900/20 p-6 rounded-2xl border border-amber-800/40 shadow-2xl backdrop-blur-sm' },
          
          // Post-it Sobre Mí
          e('div', { className: 'bg-yellow-200 text-slate-900 p-5 rounded-lg shadow-lg transform -rotate-2 hover:rotate-0 transition' },
            e('h2', { className: 'font-bold text-base border-b border-yellow-400 pb-1 mb-2' }, '📌 Sobre Mí'),
            e('p', { className: 'text-xs leading-relaxed' }, 'Especialista en producción audiovisual, estrategia digital y experiencia comercial (Xiaomi / MediaMarkt, GrupoIDEX, V3RTICE).')
          ),

          // Hoja CV
          e('div', { className: 'bg-slate-100 text-slate-900 p-5 rounded-lg shadow-lg transform rotate-1 hover:rotate-0 transition relative' },
            e('div', { className: 'absolute -top-3 right-3 text-xl' }, '📎'),
            e('h2', { className: 'font-bold text-base mb-2' }, '📄 Currículum Vitae'),
            e('p', { className: 'text-xs text-slate-600 mb-4' }, 'Experiencia en retail, campañas 360 y gestión de eventos.'),
            e('a', {
              href: '/CV-Daniel-Esteve-Quesada.pdf',
              target: '_blank',
              className: 'inline-block bg-slate-800 text-white text-xs px-3 py-2 rounded hover:bg-slate-700 transition font-medium'
            }, 'Ver / Descargar PDF')
          ),

          // Mancha de Café
          e('div', {
            onClick: () => alert("¡Café virtual tomado! Contacta conmigo por LinkedIn o Email para agendar una reunión."),
            className: 'bg-amber-800/30 border border-amber-600/40 p-5 rounded-xl flex flex-col items-center justify-center text-center cursor-pointer hover:bg-amber-800/50 transition'
          },
            e('span', { className: 'text-3xl mb-1' }, '☕'),
            e('span', { className: 'text-xs font-semibold text-amber-200' }, 'Tomar un Café')
          ),

          // Carpetas
          e('div', { className: 'md:col-span-3 grid grid-cols-2 md:grid-cols-4 gap-3 mt-2' },
            [
              { id: 'audiovisual', titulo: '🎬 Audiovisual', desc: 'MaQasa & Producción' },
              { id: 'ventas', titulo: '📱 Comercial', desc: 'Xiaomi & TCL' },
              { id: 'eventos', titulo: '🎪 Eventos', desc: 'GrupoIDEX' },
              { id: 'marketing', titulo: '📊 Marketing', desc: 'V3RTICE' }
            ].map(folder => 
              e('div', {
                key: folder.id,
                onClick: () => setDossierAbierto(folder.titulo),
                className: 'bg-amber-700/30 border border-amber-500/30 p-3 rounded-xl cursor-pointer hover:bg-amber-600/40 transition'
              },
                e('div', { className: 'text-xl mb-1' }, '📁'),
                e('h3', { className: 'font-bold text-xs text-amber-100' }, folder.titulo),
                e('p', { className: 'text-[10px] text-amber-200/60' }, folder.desc)
              )
            )
          )
        ),

        // Modal Dossier
        dossierAbierto ? e('div', { className: 'fixed inset-0 bg-black/70 flex items-center justify-center p-4 z-50' },
          e('div', { className: 'bg-slate-800 border border-slate-700 p-6 rounded-xl max-w-sm w-full shadow-2xl' },
            e('h3', { className: 'text-lg font-bold mb-2 text-white' }, dossierAbierto),
            e('p', { className: 'text-xs text-slate-300 mb-6' }, 'Detalles del proyecto, métricas e hitos clave seleccionados.'),
            e('button', {
              onClick: () => setDossierAbierto(null),
              className: 'bg-amber-600 text-white text-xs px-4 py-2 rounded hover:bg-amber-500 transition'
            }, 'Cerrar Expediente')
          )
        ) : null
      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(e(App));
  </script>
</body>
</html>
