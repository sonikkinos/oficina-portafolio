<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daniel Esteve - Portafolio Creativo</title>
  <!-- Tailwind CSS por CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React y ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel para interpretar JSX en el navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [dossierAbierto, setDossierAbierto] = useState(null);

      return (
        <div class="min-h-screen bg-amber-900/20 p-6 flex flex-col items-center justify-center font-sans">
          <!-- Escritorio Skeuomórfico -->
          <header class="text-center mb-8">
            <h1 class="text-4xl font-extrabold tracking-tight text-amber-100 mb-2">
              Mesa de Trabajo — Daniel Esteve
            </h1>
            <p class="text-amber-200/80">Especialista en Marketing 360, Audiovisual y Ventas</p>
          </header>

          <main class="grid grid-cols-1 md:grid-cols-3 gap-6 max-w-5xl w-full bg-amber-950/40 p-8 rounded-2xl border border-amber-800/40 shadow-2xl backdrop-blur-sm">
            
            <!-- Post-it Sobre Mí -->
            <div class="bg-yellow-200 text-slate-900 p-5 rounded-lg shadow-lg transform -rotate-2 hover:rotate-0 transition-transform">
              <h2 class="font-bold text-lg border-b border-yellow-400 pb-1 mb-2">📌 Sobre Mí</h2>
              <p class="text-sm">Especialista en producción audiovisual, estrategia digital y experiencia comercial (Xiaomi / MediaMarkt, GrupoIDEX, V3RTICE).</p>
            </div>

            <!-- Hoja CV con Clip -->
            <div class="bg-slate-100 text-slate-900 p-5 rounded-lg shadow-lg transform rotate-1 hover:rotate-0 transition-transform border-t-8 border-slate-400 relative">
              <div class="absolute -top-4 right-4 text-2xl">📎</div>
              <h2 class="font-bold text-lg mb-2">📄 Currículum Vitae</h2>
              <p class="text-xs text-slate-600 mb-4">Experiencia en retail, campañas 360 y gestión de eventos en vivo.</p>
              <a 
                href="/CV-Daniel-Esteve-Quesada.pdf" 
                target="_blank" 
                class="inline-block bg-slate-800 text-white text-xs px-3 py-2 rounded hover:bg-slate-700 transition"
              >
                Ver / Descargar PDF
              </a>
            </div>

            <!-- Mancha de Café (Easter Egg) -->
            <div 
              onClick={() => alert("¡Café virtual tomado! Escríbeme a mi email o LinkedIn para coordinar una reunión.")}
              class="bg-amber-800/30 border border-amber-600/40 p-5 rounded-full flex flex-col items-center justify-center text-center cursor-pointer hover:bg-amber-800/50 transition transform hover:scale-105"
            >
              <span class="text-3xl mb-1">☕</span>
              <span class="text-xs font-semibold text-amber-200">Tomar un Café</span>
            </div>

            <!-- Dossiers / Carpetas de Proyectos -->
            <div class="md:col-span-3 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 mt-4">
              {[
                { id: 'audiovisual', titulo: '🎬 Audiovisual', desc: 'MaQasa & Producciones' },
                { id: 'ventas', titulo: '📱 Experiencia Comercial', desc: 'Xiaomi (MediaMarkt) & TCL' },
                { id: 'eventos', titulo: '🎪 Eventos en Vivo', desc: 'GrupoIDEX' },
                { id: 'marketing', titulo: '📊 Marketing 360', desc: 'V3RTICE' }
              ].map((folder) => (
                <div 
                  key={folder.id}
                  onClick={() => setDossierAbierto(folder.titulo)}
                  class="bg-amber-700/40 border border-amber-500/30 p-4 rounded-xl cursor-pointer hover:bg-amber-600/40 transition shadow"
                >
                  <div class="text-2xl mb-1">📁</div>
                  <h3 class="font-bold text-sm text-amber-100">{folder.titulo}</h3>
                  <p class="text-xs text-amber-200/60">{folder.desc}</p>
                </div>
              ))}
            </div>

          </main>

          <!-- Modal de Carpeta Abierta -->
          {dossierAbierto && (
            <div class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl max-w-md w-full shadow-2xl">
                <h3 class="text-xl font-bold mb-2">{dossierAbierto}</h3>
                <p class="text-sm text-slate-300 mb-6">Detalles del expediente e hitos seleccionados.</p>
                <button 
                  onClick={() => setDossierAbierto(null)}
                  class="bg-amber-600 text-white text-xs px-4 py-2 rounded-lg hover:bg-amber-500"
                >
                  Cerrar Expediente
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
