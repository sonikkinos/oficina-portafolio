<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Daniel Esteve - Escritorio Windows XP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <style>
    body {
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      font-family: 'Tahoma', 'Segoe UI', Geneva, Verdana, sans-serif;
    }
    
    /* Ventana Windows XP */
    .xp-window {
      box-shadow: 3px 3px 14px rgba(0,0,0,0.6);
      border: 3px solid #0055ea;
      border-radius: 8px 8px 0 0;
    }
    
    .xp-titlebar {
      background: linear-gradient(to bottom, #0058ee 0%, #388cf8 10%, #0055ea 88%, #0011bb 100%);
      border-top-left-radius: 5px;
      border-top-right-radius: 5px;
    }

    /* Botones de control oficiales estilo Windows XP Luna */
    .xp-ctrl-btn {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      cursor: pointer;
      border: 1px solid #102a75;
      box-shadow: inset 1px 1px 1px rgba(255,255,255,0.7);
    }

    .xp-btn-min-max {
      background: linear-gradient(to bottom, #3c82f8 0%, #2968db 50%, #1748a8 100%);
    }
    .xp-btn-min-max:hover {
      background: linear-gradient(to bottom, #5093ff 0%, #3a7aff 50%, #2059c4 100%);
    }

    .xp-btn-close {
      background: linear-gradient(to bottom, #e25842 0%, #cc331a 50%, #991e0b 100%);
      border-color: #520b02;
    }
    .xp-btn-close:hover {
      background: linear-gradient(to bottom, #f06a54 0%, #e63e24 50%, #b3240f 100%);
    }

    /* Barra de Tareas */
    .xp-taskbar {
      background: linear-gradient(to bottom, #1f2f86 0%, #3168d5 10%, #2557c6 90%, #1941a5 100%);
    }

    .xp-start-btn {
      background: linear-gradient(to bottom, #388e3c 0%, #4caf50 50%, #2e7d32 100%);
      box-shadow: inset 1px 1px 2px #a5d6a7, inset -1px -1px 2px #1b5e20;
    }

    @keyframes floatClippy {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .clippy-animate {
      animation: floatClippy 2.5s ease-in-out infinite;
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-cover bg-center" style="background-image: url('https://upload.wikimedia.org/wikipedia/en/2/27/Bliss_%28Windows_XP%29.png');">
  <div id="root" class="h-full w-full"></div>

  <script>
    const e = React.createElement;
    const { useState, useEffect } = React;

    const ICONS = {
      myComputer: 'https://win98icons.alexmeub.com/icons/png/computer_explorer-4.png',
      recycleBin: 'https://win98icons.alexmeub.com/icons/png/recycle_bin_empty-4.png',
      notepad: 'https://win98icons.alexmeub.com/icons/png/notepad-5.png',
      folder: 'https://win98icons.alexmeub.com/icons/png/directory_closed-4.png',
      internetExplorer: 'https://win98icons.alexmeub.com/icons/png/msie1-4.png'
    };

    const HardDriveIcon = () => e('svg', { width: '32', height: '32', viewBox: '0 0 36 36', fill: 'none' },
      e('rect', { x: '4', y: '10', width: '28', height: '16', rx: '2', fill: '#94a3b8', stroke: '#334155', strokeWidth: '1.5' }),
      e('rect', { x: '6', y: '12', width: '24', height: '12', rx: '1', fill: '#cbd5e1' }),
      e('circle', { cx: '9', cy: '18', r: '1.5', fill: '#22c55e' }),
      e('rect', { x: '13', y: '16', width: '14', height: '4', fill: '#64748b', rx: '0.5' })
    );

    const CdDriveIcon = () => e('svg', { width: '32', height: '32', viewBox: '0 0 36 36', fill: 'none' },
      e('rect', { x: '3', y: '11', width: '30', height: '14', rx: '2', fill: '#cbd5e1', stroke: '#475569', strokeWidth: '1.5' }),
      e('rect', { x: '6', y: '15', width: '24', height: '3', fill: '#94a3b8' }),
      e('circle', { cx: '27', cy: '21', r: '1', fill: '#3b82f6' }),
      e('rect', { x: '7', y: '20', width: '4', height: '2', fill: '#64748b' })
    );

    function App() {
      const isMobile = window.innerWidth <= 640;

      const [windows, setWindows] = useState({
        myComputer: { id: 'myComputer', title: 'Mi PC', iconSrc: ICONS.myComputer, isOpen: false, isMinimized: false, pos: { x: isMobile ? 10 : 80, y: isMobile ? 20 : 40 }, isMax: isMobile, zIndex: 10 },
        cv: { id: 'cv', title: 'Mi CV.txt - Bloc de notas', iconSrc: ICONS.notepad, isOpen: false, isMinimized: false, pos: { x: isMobile ? 10 : 120, y: isMobile ? 20 : 40 }, isMax: isMobile, zIndex: 10 },
        proyectosPersonales: { id: 'proyectosPersonales', title: 'Explorador - C:\\Proyectos Personales', iconSrc: ICONS.folder, isOpen: false, isMinimized: false, pos: { x: isMobile ? 10 : 150, y: isMobile ? 20 : 60 }, isMax: isMobile, zIndex: 10 },
        proyectosLaborales: { id: 'proyectosLaborales', title: 'Explorador - C:\\Proyectos Laborales', iconSrc: ICONS.folder, isOpen: false, isMinimized: false, pos: { x: isMobile ? 10 : 180, y: isMobile ? 20 : 90 }, isMax: isMobile, zIndex: 10 },
        rrss: { id: 'rrss', title: 'Internet Explorer - Redes Sociales', iconSrc: ICONS.internetExplorer, isOpen: false, isMinimized: false, pos: { x: isMobile ? 10 : 210, y: isMobile ? 20 : 120 }, isMax: isMobile, zIndex: 10 },
        contacto: { id: 'contacto', title: 'Asistente - Datos de Contacto', iconSrc: null, isOpen: false, isMinimized: false, pos: { x: isMobile ? 10 : 240, y: isMobile ? 20 : 140 }, isMax: false, zIndex: 10 }
      });

      // Cálculo de posiciones responsive
      const getInitialPositions = () => {
        const mobile = window.innerWidth <= 640;
        const width = window.innerWidth;
        if (mobile) {
          return {
            myComputer: { x: 15, y: 15 },
            cv: { x: 15, y: 105 },
            rrss: { x: 15, y: 195 },
            recycleBin: { x: 15, y: 285 },
            proyectosLaborales: { x: width - 95, y: 15 },
            proyectosPersonales: { x: width - 95, y: 105 }
          };
        }
        return {
          myComputer: { x: 25, y: 20 },
          cv: { x: 30, y: 130 },
          rrss: { x: 22, y: 240 },
          recycleBin: { x: 35, y: 350 },
          proyectosLaborales: { x: width - 125, y: 30 },
          proyectosPersonales: { x: width - 120, y: 150 }
        };
      };

      const [iconPositions, setIconPositions] = useState(getInitialPositions());

      const [navPersonales, setNavPersonales] = useState([]);
      const [navLaborales, setNavLaborales] = useState([]);

      const [customFoldersPersonales, setCustomFoldersPersonales] = useState({});
      const [customFoldersLaborales, setCustomFoldersLaborales] = useState({
        'V3RTICE': [],
        'MaQasa': [],
        'Concursos': []
      });

      const [activeWin, setActiveWin] = useState(null);
      const [topZ, setTopZ] = useState(20);
      const [startMenuOpen, setStartMenuOpen] = useState(false);

      const openWindow = (id) => {
        const nextZ = topZ + 1;
        setTopZ(nextZ);
        setWindows(prev => ({
          ...prev,
          [id]: { ...prev[id], isOpen: true, isMinimized: false, zIndex: nextZ }
        }));
        setActiveWin(id);
      };

      const closeWindow = (id) => {
        setWindows(prev => ({
          ...prev,
          [id]: { ...prev[id], isOpen: false }
        }));
      };

      const toggleMinimize = (id) => {
        setWindows(prev => ({
          ...prev,
          [id]: { ...prev[id], isMinimized: !prev[id].isMinimized }
        }));
      };

      const toggleMaximize = (id) => {
        setWindows(prev => ({
          ...prev,
          [id]: { ...prev[id], isMax: !prev[id].isMax }
        }));
      };

      const focusWindow = (id) => {
        const nextZ = topZ + 1;
        setTopZ(nextZ);
        setWindows(prev => ({
          ...prev,
          [id]: { ...prev[id], isMinimized: false, zIndex: nextZ }
        }));
        setActiveWin(id);
      };

      // Arrastre con ratón o toque táctil para Ventanas
      const handleWindowStart = (id, clientX, clientY) => {
        focusWindow(id);
        const initialPos = { ...windows[id].pos };

        const onMove = (moveEvt) => {
          const cx = moveEvt.touches ? moveEvt.touches[0].clientX : moveEvt.clientX;
          const cy = moveEvt.touches ? moveEvt.touches[0].clientY : moveEvt.clientY;
          const dx = cx - clientX;
          const dy = cy - clientY;
          setWindows(prev => ({
            ...prev,
            [id]: {
              ...prev[id],
              pos: { x: Math.max(0, initialPos.x + dx), y: Math.max(0, initialPos.y + dy) }
            }
          }));
        };

        const onEnd = () => {
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onEnd);
          window.removeEventListener('touchmove', onMove);
          window.removeEventListener('touchend', onEnd);
        };

        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);
        window.addEventListener('touchmove', onMove);
        window.addEventListener('touchend', onEnd);
      };

      // Arrastre con ratón o toque táctil para Iconos
      const handleIconStart = (key, evt, clientX, clientY) => {
        evt.stopPropagation();
        const initialPos = { ...iconPositions[key] };

        const onMove = (moveEvt) => {
          const cx = moveEvt.touches ? moveEvt.touches[0].clientX : moveEvt.clientX;
          const cy = moveEvt.touches ? moveEvt.touches[0].clientY : moveEvt.clientY;
          const dx = cx - clientX;
          const dy = cy - clientY;
          setIconPositions(prev => ({
            ...prev,
            [key]: { x: Math.max(0, initialPos.x + dx), y: Math.max(0, initialPos.y + dy) }
          }));
        };

        const onEnd = () => {
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onEnd);
          window.removeEventListener('touchmove', onMove);
          window.removeEventListener('touchend', onEnd);
        };

        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);
        window.addEventListener('touchmove', onMove);
        window.addEventListener('touchend', onEnd);
      };

      const handleSendEmail = () => {
        const asunto = encodeURIComponent("Contacto desde Portafolio Web");
        const cuerpo = encodeURIComponent("Hola Daniel,\n\nMe gustaría contactar contigo para conocernos mejor y trabajar juntos.\n\nUn saludo,");
        const email = "estevequesadadaniel@gmail.com";

        const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${email}&su=${asunto}&body=${cuerpo}`;
        window.open(gmailUrl, '_blank');
      };

      const handleCreateFolder = (type) => {
        const folderName = prompt("Introduce el nombre de la nueva subcarpeta:");
        if (!folderName || !folderName.trim()) return;

        const name = folderName.trim();
        if (type === 'personales') {
          const currentPathKey = navPersonales.join('/');
          setCustomFoldersPersonales(prev => ({
            ...prev,
            [currentPathKey]: [...(prev[currentPathKey] || []), name]
          }));
        } else {
          const currentPathKey = navLaborales.join('/');
          setCustomFoldersLaborales(prev => ({
            ...prev,
            [currentPathKey]: [...(prev[currentPathKey] || []), name]
          }));
        }
      };

      const renderXPWindow = (winKey, children, widthClass = "w-[95vw] sm:w-[90vw] max-w-[720px]") => {
        const win = windows[winKey];
        if (!win.isOpen || win.isMinimized) return null;

        const style = win.isMax
          ? { top: 0, left: 0, width: '100vw', height: 'calc(100vh - 40px)', zIndex: win.zIndex, borderRadius: 0 }
          : { top: `${win.pos.y}px`, left: `${win.pos.x}px`, zIndex: win.zIndex };

        return e('div', {
          style,
          onClick: () => focusWindow(winKey),
          className: `fixed xp-window bg-slate-100 flex flex-col overflow-hidden ${win.isMax ? 'h-[calc(100vh-40px)] w-full' : widthClass}`
        },
          e('div', {
            onMouseDown: (evt) => !win.isMax && handleWindowStart(winKey, evt.clientX, evt.clientY),
            onTouchStart: (evt) => !win.isMax && handleWindowStart(winKey, evt.touches[0].clientX, evt.touches[0].clientY),
            className: 'xp-titlebar text-white px-2 py-1 flex justify-between items-center font-bold text-xs cursor-move select-none shrink-0'
          },
            e('div', { className: 'flex items-center gap-1.5' },
              win.iconSrc ? e('img', { src: win.iconSrc, className: 'w-4 h-4' }) : e('span', {}, '📎'),
              e('span', { className: 'truncate max-w-[200px] sm:max-w-[320px]' }, win.title)
            ),
            
            e('div', { className: 'flex items-center gap-1', onClick: (evt) => evt.stopPropagation() },
              e('button', {
                onClick: () => toggleMinimize(winKey),
                className: 'xp-ctrl-btn xp-btn-min-max',
                title: 'Minimizar'
              },
                e('svg', { width: '8', height: '2', viewBox: '0 0 8 2', fill: 'white' },
                  e('rect', { width: '8', height: '2' })
                )
              ),
              
              e('button', {
                onClick: () => toggleMaximize(winKey),
                className: 'xp-ctrl-btn xp-btn-min-max',
                title: win.isMax ? 'Restaurar' : 'Maximizar'
              },
                e('svg', { width: '9', height: '9', viewBox: '0 0 9 9', fill: 'none', stroke: 'white', strokeWidth: '1.5' },
                  e('rect', { x: '0.75', y: '0.75', width: '7.5', height: '7.5' })
                )
              ),
              
              e('button', {
                onClick: () => closeWindow(winKey),
                className: 'xp-ctrl-btn xp-btn-close',
                title: 'Cerrar'
              },
                e('svg', { width: '8', height: '8', viewBox: '0 0 8 8', stroke: 'white', strokeWidth: '1.8', strokeLinecap: 'round' },
                  e('line', { x1: '0', y1: '0', x2: '8', y2: '8' }),
                  e('line', { x1: '8', y1: '0', x2: '0', y2: '8' })
                )
              )
            )
          ),
          
          e('div', { className: `p-2 sm:p-3 overflow-y-auto flex-1 text-slate-900 font-sans ${win.isMax ? 'h-full flex flex-col' : 'max-h-[75vh]'}` }, children)
        );
      };

      const currentPathPersonales = navPersonales.join('/');
      const subFoldersPersonales = customFoldersPersonales[currentPathPersonales] || [];

      const currentPathLaborales = navLaborales.join('/');
      let currentItemsLaborales = [];
      if (navLaborales.length === 0) {
        currentItemsLaborales = ['V3RTICE', 'MaQasa', 'Concursos'];
      } else {
        currentItemsLaborales = customFoldersLaborales[currentPathLaborales] || [];
      }

      return e('div', { className: 'h-full w-full relative overflow-hidden', onClick: () => setStartMenuOpen(false) },
        
        /* ICONOS DEL ESCRITORIO CON ACCESO POR CLIC O TOQUE */
        Object.entries({
          myComputer: { label: 'Mi PC', icon: ICONS.myComputer, action: () => openWindow('myComputer') },
          cv: { label: 'Mi CV.txt', icon: ICONS.notepad, action: () => openWindow('cv') },
          rrss: { label: 'RRSS', icon: ICONS.internetExplorer, action: () => openWindow('rrss') },
          recycleBin: { label: 'Papelera', icon: ICONS.recycleBin, action: () => {} },
          proyectosLaborales: { label: 'Proyectos Laborales', icon: ICONS.folder, action: () => openWindow('proyectosLaborales') },
          proyectosPersonales: { label: 'Proyectos Personales', icon: ICONS.folder, action: () => openWindow('proyectosPersonales') }
        }).map(([key, item]) => 
          e('div', {
            key,
            onMouseDown: (evt) => handleIconStart(key, evt, evt.clientX, evt.clientY),
            onTouchStart: (evt) => handleIconStart(key, evt, evt.touches[0].clientX, evt.touches[0].clientY),
            onDoubleClick: item.action,
            onClick: () => { if (isMobile) item.action(); },
            style: { top: `${iconPositions[key].y}px`, left: `${iconPositions[key].x}px` },
            className: 'absolute w-20 sm:w-22 flex flex-col items-center cursor-pointer p-1 rounded hover:bg-blue-600/30 active:bg-blue-600/50 text-white text-[11px] sm:text-xs drop-shadow-[0_1px_2px_rgba(0,0,0,0.9)] text-center select-none'
          },
            e('img', { src: item.icon, className: 'w-8 h-8 sm:w-10 sm:h-10 mb-1 pointer-events-none' }),
            e('span', { className: 'leading-tight' }, item.label)
          )
        ),

        /* VENTANA: MI PC */
        renderXPWindow('myComputer',
          e('div', { className: 'flex flex-col md:flex-row gap-3 sm:gap-4' },
            e('div', { className: 'w-full md:w-48 bg-gradient-to-b from-blue-100 to-blue-200 border border-blue-300 p-2 sm:p-3 rounded text-xs space-y-2 shrink-0' },
              e('div', { className: 'bg-white p-2 rounded shadow-xs border border-blue-200' },
                e('h4', { className: 'font-bold text-blue-900 border-b border-blue-200 pb-1 mb-1' }, 'Información del Sistema'),
                e('p', { className: 'text-slate-700' }, '💻 Sistema: Windows XP Professional'),
                e('p', { className: 'text-slate-700' }, '🧠 Procesador: Intel Core i7'),
                e('p', { className: 'text-slate-700' }, '⚡ Memoria RAM: 32 GB DDR4')
              ),
              e('div', { className: 'bg-white p-2 rounded shadow-xs border border-blue-200' },
                e('h4', { className: 'font-bold text-blue-900 border-b border-blue-200 pb-1 mb-1' }, 'Ubicación'),
                e('p', { className: 'text-slate-600' }, '📍 Alicante, España')
              )
            ),

            e('div', { className: 'flex-1 space-y-3' },
              e('div', {},
                e('h3', { className: 'font-bold text-slate-700 text-xs border-b pb-1 mb-2' }, 'Archivos almacenados en este equipo'),
                e('div', { className: 'grid grid-cols-1 sm:grid-cols-2 gap-2.5' },
                  e('div', {
                    onClick: () => openWindow('proyectosLaborales'),
                    className: 'p-2 bg-white border border-slate-300 rounded shadow-xs hover:bg-blue-50 cursor-pointer flex items-center gap-3'
                  },
                    e(HardDriveIcon),
                    e('div', {},
                      e('p', { className: 'font-bold text-xs' }, 'Disco local (C:)'),
                      e('p', { className: 'text-[10px] text-slate-500' }, '45 GB libres de 120 GB')
                    )
                  ),

                  e('div', {
                    onClick: () => openWindow('proyectosPersonales'),
                    className: 'p-2 bg-white border border-slate-300 rounded shadow-xs hover:bg-blue-50 cursor-pointer flex items-center gap-3'
                  },
                    e(HardDriveIcon),
                    e('div', {},
                      e('p', { className: 'font-bold text-xs' }, 'Disco local (D:)'),
                      e('p', { className: 'text-[10px] text-slate-500' }, '90 GB libres de 250 GB')
                    )
                  )
                )
              ),

              e('div', {},
                e('h3', { className: 'font-bold text-slate-700 text-xs border-b pb-1 mb-2' }, 'Dispositivos con almacenamiento extraíble'),
                e('div', { className: 'p-2 bg-white border border-slate-300 rounded shadow-xs flex items-center gap-3 w-full sm:w-1/2' },
                  e(CdDriveIcon),
                  e('div', {},
                    e('p', { className: 'font-bold text-xs' }, 'Unidad de CD-RW (E:)'),
                    e('p', { className: 'text-[10px] text-slate-500' }, 'Sin disco insertado')
                  )
                )
              )
            )
          )
        ),

        /* VENTANA: MI CV */
        renderXPWindow('cv',
          e('div', { className: 'flex flex-col h-full w-full gap-2' },
            e('div', { className: 'bg-white border border-slate-300 p-2 text-xs flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 shadow-inner shrink-0' },
              e('div', {},
                e('p', { className: 'font-bold text-slate-800' }, '📄 CURRÍCULUM VITAE — DANIEL ESTEVE QUESADA'),
                e('p', { className: 'text-[11px] text-slate-600' }, 'Sugerencia: Puedes usar el botón para descargarlo directamente.')
              ),
              e('a', {
                href: '/CV-Daniel-Esteve-Quesada.pdf',
                download: 'CV-Daniel-Esteve-Quesada.pdf',
                target: '_blank',
                className: 'bg-green-600 hover:bg-green-700 text-white font-bold text-xs px-3 py-1.5 rounded shadow flex items-center gap-1.5 transition'
              },
                e('span', {}, '📥'),
                e('span', {}, 'Descargar CV (PDF)')
              )
            ),
            e('iframe', {
              src: '/CV-Daniel-Esteve-Quesada.pdf',
              className: `w-full border border-slate-400 bg-white shadow-inner flex-1 ${windows.cv.isMax ? 'min-h-[70vh]' : 'h-[320px] sm:h-[420px]'}`,
              title: 'Vista previa CV'
            })
          )
        ),

        /* VENTANA 1: PROYECTOS PERSONALES */
        renderXPWindow('proyectosPersonales',
          e('div', { className: 'space-y-3' },
            e('div', { className: 'bg-slate-200 p-2 border border-slate-300 rounded text-xs flex items-center justify-between gap-2' },
              e('div', { className: 'flex items-center gap-2 truncate' },
                navPersonales.length > 0 && e('button', {
                  onClick: () => setNavPersonales(prev => prev.slice(0, -1)),
                  className: 'bg-white border border-slate-400 px-2 py-0.5 rounded font-bold hover:bg-slate-100'
                }, '⬅ Atrás'),
                e('span', { className: 'font-mono text-slate-700 truncate' }, `C:\\Proyectos Personales${navPersonales.length ? '\\' + navPersonales.join('\\') : ''}`)
              ),
              e('button', {
                onClick: () => handleCreateFolder('personales'),
                className: 'bg-blue-600 hover:bg-blue-700 text-white font-bold px-2 py-1 rounded shadow text-xs shrink-0'
              }, '+ Nueva Subcarpeta')
            ),

            e('div', { className: 'bg-white p-3 sm:p-4 border border-slate-300 rounded min-h-[220px]' },
              subFoldersPersonales.length === 0 ? e('div', { className: 'text-center py-8 text-slate-500 text-xs' },
                e('p', { className: 'text-base mb-1' }, '📁'),
                e('p', {}, 'Esta carpeta está vacía.'),
                e('p', { className: 'text-[11px] text-slate-400 mt-1' }, 'Haz clic en "+ Nueva Subcarpeta" arriba para añadir organizadores o fotos/vídeos.')
              ) : e('div', { className: 'grid grid-cols-2 sm:grid-cols-4 gap-3' },
                subFoldersPersonales.map((folder, idx) =>
                  e('div', {
                    key: idx,
                    onClick: () => setNavPersonales(prev => [...prev, folder]),
                    className: 'p-2 sm:p-3 border border-slate-200 rounded shadow-xs hover:bg-blue-50 cursor-pointer flex flex-col items-center text-center'
                  },
                    e('img', { src: ICONS.folder, className: 'w-8 h-8 sm:w-10 sm:h-10 mb-1 pointer-events-none' }),
                    e('span', { className: 'font-bold text-xs truncate w-full' }, folder)
                  )
                )
              )
            )
          )
        ),

        /* VENTANA 2: PROYECTOS LABORALES */
        renderXPWindow('proyectosLaborales',
          e('div', { className: 'space-y-3' },
            e('div', { className: 'bg-slate-200 p-2 border border-slate-300 rounded text-xs flex items-center justify-between gap-2' },
              e('div', { className: 'flex items-center gap-2 truncate' },
                navLaborales.length > 0 && e('button', {
                  onClick: () => setNavLaborales(prev => prev.slice(0, -1)),
                  className: 'bg-white border border-slate-400 px-2 py-0.5 rounded font-bold hover:bg-slate-100'
                }, '⬅ Atrás'),
                e('span', { className: 'font-mono text-slate-700 truncate' }, `C:\\Proyectos Laborales${navLaborales.length ? '\\' + navLaborales.join('\\') : ''}`)
              ),
              navLaborales.length > 0 && e('button', {
                onClick: () => handleCreateFolder('laborales'),
                className: 'bg-blue-600 hover:bg-blue-700 text-white font-bold px-2 py-1 rounded shadow text-xs shrink-0'
              }, '+ Nueva Subcarpeta')
            ),

            e('div', { className: 'bg-white p-3 sm:p-4 border border-slate-300 rounded min-h-[220px]' },
              currentItemsLaborales.length === 0 ? e('div', { className: 'text-center py-8 text-slate-500 text-xs' },
                e('p', { className: 'text-base mb-1' }, '📁'),
                e('p', {}, 'Esta carpeta no tiene subcarpetas.'),
                e('p', { className: 'text-[11px] text-slate-400 mt-1' }, 'Puedes pulsar "+ Nueva Subcarpeta" para organizar el contenido.')
              ) : e('div', { className: 'grid grid-cols-2 sm:grid-cols-3 gap-3' },
                currentItemsLaborales.map((folder, idx) =>
                  e('div', {
                    key: idx,
                    onClick: () => setNavLaborales(prev => [...prev, folder]),
                    className: 'p-2 sm:p-3 border border-slate-200 rounded shadow-xs hover:bg-blue-50 cursor-pointer flex flex-col items-center text-center'
                  },
                    e('img', { src: ICONS.folder, className: 'w-8 h-8 sm:w-10 sm:h-10 mb-1 pointer-events-none' }),
                    e('span', { className: 'font-bold text-xs truncate w-full' }, folder),
                    navLaborales.length === 0 && e('span', { className: 'text-[10px] text-slate-500 mt-0.5' }, 'Carpeta de proyectos')
                  )
                )
              )
            )
          )
        ),

        /* VENTANA: INTERNET EXPLORER (RRSS) */
        renderXPWindow('rrss',
          e('div', {},
            e('div', { className: 'bg-slate-200 p-2 border-b border-slate-300 text-xs mb-3 flex items-center gap-2' },
              e('span', { className: 'font-bold' }, 'Dirección:'),
              e('input', {
                type: 'text',
                readOnly: true,
                value: 'http://www.danielesteve.com/rrss',
                className: 'w-full bg-white border border-slate-400 px-2 py-0.5 rounded'
              })
            ),
            e('div', { className: 'flex flex-col gap-2.5' },
              e('a', {
                href: 'https://www.linkedin.com/in/danielestevequesada',
                target: '_blank',
                className: 'flex items-center gap-3 bg-blue-600 text-white p-3 rounded font-bold hover:bg-blue-700 transition shadow'
              },
                e('span', { className: 'text-xl' }, '💼'),
                e('span', {}, 'Perfil de LinkedIn')
              ),
              e('a', {
                href: 'https://www.instagram.com',
                target: '_blank',
                className: 'flex items-center gap-3 bg-gradient-to-r from-purple-500 via-pink-500 to-yellow-500 text-white p-3 rounded font-bold hover:opacity-90 transition shadow'
              },
                e('span', { className: 'text-xl' }, '📷'),
                e('span', {}, 'Instagram')
              )
            )
          ),
          "w-[95vw] sm:w-[90vw] max-w-[420px]"
        ),

        /* CLIPPY ASISTENTE */
        e('div', { className: 'fixed bottom-12 right-4 sm:right-6 flex flex-col items-end z-30' },
          e('div', {
            className: 'bg-amber-100 border-2 border-slate-800 p-2 rounded-xl text-slate-900 text-xs font-bold shadow-lg mb-2 relative max-w-[140px] sm:max-w-[160px] text-center'
          },
            'Contáctame haciendo click',
            e('div', { className: 'absolute -bottom-2 right-6 w-0 h-0 border-l-[8px] border-l-transparent border-r-[8px] border-r-transparent border-t-[8px] border-t-slate-800' })
          ),
          e('div', {
            onClick: () => openWindow('contacto'),
            className: 'cursor-pointer clippy-animate hover:scale-110 transition-transform bg-amber-200/20 p-1.5 rounded-full backdrop-blur-xs'
          },
            e('svg', {
              width: '50',
              height: '60',
              viewBox: '0 0 60 70',
              fill: 'none',
              className: 'drop-shadow-lg'
            },
              e('path', { d: 'M 20 60 L 20 20 A 15 15 0 0 1 50 20 L 50 50 A 10 10 0 0 1 30 50 L 30 25 A 5 5 0 0 1 40 25 L 40 45', stroke: '#8a9ba8', strokeWidth: '6', strokeLinecap: 'round', fill: 'none' }),
              e('path', { d: 'M 20 60 L 20 20 A 15 15 0 0 1 50 20 L 50 50 A 10 10 0 0 1 30 50 L 30 25 A 5 5 0 0 1 40 25 L 40 45', stroke: '#dbe5ec', strokeWidth: '3', strokeLinecap: 'round', fill: 'none' }),
              e('circle', { cx: '32', cy: '16', r: '5', fill: 'white', stroke: 'black', strokeWidth: '1' }),
              e('circle', { cx: '44', cy: '16', r: '5', fill: 'white', stroke: 'black', strokeWidth: '1' }),
              e('circle', { cx: '33', cy: '16', r: '2', fill: 'black' }),
              e('circle', { cx: '45', cy: '16', r: '2', fill: 'black' })
            )
          )
        ),

        /* VENTANA CONTACTO */
        renderXPWindow('contacto',
          e('div', { className: 'bg-yellow-100 border border-yellow-300 p-3 sm:p-4 rounded shadow-inner text-slate-900 font-mono text-xs space-y-2.5' },
            e('h3', { className: 'font-bold border-b border-yellow-300 pb-1 mb-2 text-sm' }, '📋 Datos de Contacto:'),
            e('p', {}, '📞 Teléfono: +34 627 99 48 98'),
            e('p', {}, '✉️ Email: estevequesadadaniel@gmail.com'),
            
            e('div', { className: 'pt-2' },
              e('button', {
                onClick: handleSendEmail,
                className: 'w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 text-white font-sans font-bold p-2.5 rounded transition shadow cursor-pointer'
              },
                e('span', {}, '✉️'),
                e('span', {}, 'Enviar Email Directo')
              )
            )
          ),
          "w-[95vw] sm:w-[90vw] max-w-[380px]"
        ),

        /* MENÚ DE INICIO */
        startMenuOpen && e('div', {
          onClick: (evt) => evt.stopPropagation(),
          className: 'fixed bottom-10 left-0 w-60 sm:w-64 bg-white border-2 border-blue-600 rounded-tr-lg shadow-2xl z-50 overflow-hidden font-sans text-xs'
        },
          e('div', { className: 'bg-blue-600 p-3 text-white font-bold flex items-center gap-2' },
            e('span', { className: 'text-base' }, '👤'),
            e('span', {}, 'Daniel Esteve Quesada')
          ),
          e('div', { className: 'p-2 flex flex-col gap-1 bg-slate-50' },
            e('div', { onClick: () => { openWindow('myComputer'); setStartMenuOpen(false); }, className: 'p-2 hover:bg-blue-100 rounded cursor-pointer flex items-center gap-2' },
              e('img', { src: ICONS.myComputer, className: 'w-5 h-5' }),
              e('span', {}, 'Mi PC')
            ),
            e('div', { onClick: () => { openWindow('cv'); setStartMenuOpen(false); }, className: 'p-2 hover:bg-blue-100 rounded cursor-pointer flex items-center gap-2' },
              e('img', { src: ICONS.notepad, className: 'w-5 h-5' }),
              e('span', {}, 'Mi CV.txt')
            ),
            e('div', { onClick: () => { openWindow('proyectosPersonales'); setStartMenuOpen(false); }, className: 'p-2 hover:bg-blue-100 rounded cursor-pointer flex items-center gap-2' },
              e('img', { src: ICONS.folder, className: 'w-5 h-5' }),
              e('span', {}, 'Proyectos Personales')
            ),
            e('div', { onClick: () => { openWindow('proyectosLaborales'); setStartMenuOpen(false); }, className: 'p-2 hover:bg-blue-100 rounded cursor-pointer flex items-center gap-2' },
              e('img', { src: ICONS.folder, className: 'w-5 h-5' }),
              e('span', {}, 'Proyectos Laborales')
            ),
            e('div', { onClick: () => { openWindow('rrss'); setStartMenuOpen(false); }, className: 'p-2 hover:bg-blue-100 rounded cursor-pointer flex items-center gap-2' },
              e('img', { src: ICONS.internetExplorer, className: 'w-5 h-5' }),
              e('span', {}, 'Redes Sociales')
            )
          )
        ),

        /* BARRA DE TAREAS RESPONSIVE */
        e('footer', { className: 'fixed bottom-0 left-0 right-0 h-10 xp-taskbar flex justify-between items-center px-1 z-50 border-t border-blue-400' },
          e('div', { className: 'flex items-center gap-1.5 h-full overflow-x-auto' },
            e('button', {
              onClick: (evt) => { evt.stopPropagation(); setStartMenuOpen(!startMenuOpen); },
              className: 'xp-start-btn text-white font-extrabold italic text-xs sm:text-sm px-3 sm:px-4 h-8 rounded-r-lg flex items-center gap-1 shadow-md border-r border-green-300 hover:brightness-110 shrink-0'
            },
              e('span', { className: 'text-base sm:text-lg' }, '❖'),
              e('span', {}, 'inicio')
            ),

            Object.entries(windows).map(([id, win]) => {
              if (!win.isOpen) return null;
              const isActive = activeWin === id && !win.isMinimized;
              return e('button', {
                key: id,
                onClick: () => {
                  if (win.isMinimized || activeWin !== id) focusWindow(id);
                  else toggleMinimize(id);
                },
                className: `h-7 px-2 sm:px-3 rounded text-xs font-semibold flex items-center gap-1 border max-w-[110px] sm:max-w-[150px] truncate shrink-0 ${
                  isActive
                    ? 'bg-blue-800 text-white border-blue-900 shadow-inner'
                    : 'bg-blue-500/40 text-blue-100 border-blue-400/40 hover:bg-blue-500/60'
                }`
              },
                win.iconSrc ? e('img', { src: win.iconSrc, className: 'w-3.5 h-3.5' }) : e('span', {}, '📎'),
                e('span', { className: 'truncate' }, win.title)
              );
            })
          ),

          e('div', { className: 'bg-cyan-500/40 border border-cyan-300/30 text-white text-[11px] sm:text-xs px-2 sm:px-3 h-8 flex items-center rounded shrink-0' },
            new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          )
        )

      );
    }

    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(e(App));
  </script>
</body>
</html>
