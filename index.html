<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Daniel Esteve - Escritorio Windows XP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <style>
    body {
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      font-family: 'Tahoma', 'Segoe UI', Geneva, Verdana, sans-serif;
    }
    
    /* Ventana Windows XP */
    .xp-window {
      box-shadow: 3px 3px 14px rgba(0,0,0,0.6);
      border: 3px solid #0055ea;
      border-radius: 8px 8px 0 0;
    }
    
    .xp-titlebar {
      background: linear-gradient(to bottom, #0058ee 0%, #388cf8 10%, #0055ea 88%, #0011bb 100%);
      border-top-left-radius: 5px;
      border-top-right-radius: 5px;
    }

    /* Botones de control oficiales estilo Windows XP Luna */
    .xp-ctrl-btn {
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      cursor: pointer;
      border: 1px solid #102a75;
      box-shadow: inset 1px 1px 1px rgba(255,255,255,0.7);
    }

    .xp-btn-min-max {
      background: linear-gradient(to bottom, #3c82f8 0%, #2968db 50%, #1748a8 100%);
    }
    .xp-btn-min-max:hover {
      background: linear-gradient(to bottom, #5093ff 0%, #3a7aff 50%, #2059c4 100%);
    }

    .xp-btn-close {
      background: linear-gradient(to bottom, #e25842 0%, #cc331a 50%, #991e0b 100%);
      border-color: #520b02;
    }
    .xp-btn-close:hover {
      background: linear-gradient(to bottom, #f06a54 0%, #e63e24 50%, #b3240f 100%);
    }

    /* Barra de Tareas */
    .xp-taskbar {
      background: linear-gradient(to bottom, #1f2f86 0%, #3168d5 10%, #2557c6 90%, #1941a5 100%);
    }

    .xp-start-btn {
      background: linear-gradient(to bottom, #388e3c 0%, #4caf50 50%, #2e7d32 100%);
      box-shadow: inset 1px 1px 2px #a5d6a7, inset -1px -1px 2px #1b5e20;
    }

    /* Estilos Clásicos de Windows Media Player XP */
    .wmp-body {
      background: linear-gradient(to bottom, #1a2a40 0%, #0d1622 100%);
      border: 2px solid #3b577d;
    }
    .wmp-screen {
      background: #000000;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.9), inset 0 0 2px #000;
      border: 2px solid #283e5a;
    }
    .wmp-btn-main {
      background: radial-gradient(circle, #00d2ff 0%, #0066cc 60%, #003366 100%);
      box-shadow: 0 0 8px #00aaff, inset 1px 1px 2px #ffffff;
    }
    .wmp-btn-main:hover {
      background: radial-gradient(circle, #33ddff 0%, #0088ff 60%, #004488 100%);
      box-shadow: 0 0 12px #00ccff;
    }

    @keyframes floatClippy {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .clippy-animate {
      animation: floatClippy 2.5s ease-in-out infinite;
    }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-cover bg-center" style="background-image: url('https://upload.wikimedia.org/wikipedia/en/2/27/Bliss_%28Windows_XP%29.png');">
  <div id="root" class="h-full w-full"></div>

  <script>
    const e = React.createElement;
    const { useState, useRef, useEffect } = React;

    const ICONS = {
      myComputer: 'https://win98icons.alexmeub.com/icons/png/computer_explorer-4.png',
      recycleBin: 'https://win98icons.alexmeub.com/icons/png/recycle_bin_empty-4.png',
      notepad: 'https://win98icons.alexmeub.com/icons/png/notepad-5.png',
      folder: 'https://win98icons.alexmeub.com/icons/png/directory_closed-4.png',
      internetExplorer: 'https://win98icons.alexmeub.com/icons/png/msie1-4.png',
      paint: 'https://win98icons.alexmeub.com/icons/png/paint_file-2.png',
      minesweeper: 'https://win98icons.alexmeub.com/icons/png/game_mine_1-0.png',
      video: 'https://win98icons.alexmeub.com/icons/png/mmsys_114-0.png',
      mediaPlayer: 'https://win98icons.alexmeub.com/icons/png/mplayer-2.png'
    };

    // VÍDEOS DE MAQASA
    const videosMaQasa = [
      { id: 1, title: 'MaQasa - Presentación 1.mp4', youtubeId: 'RF_x4QkbYAM' },
      { id: 2, title: 'MaQasa - Demostración 2.mp4', youtubeId: 'T9n1ccoLylo' },
      { id: 3, title: 'MaQasa - Proyecto 3.mp4', youtubeId: '2heu2DE75Ts' }
    ];

    // PLAYLIST DE MÚSICA PROPIA (Sustituiremos estas fuentes por tus archivos descomprimidos del .ZIP)
    const playlist = [
      { id: 1, title: 'Pista 1 - Música de Fondo', artist: 'Daniel Esteve', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3' },
      { id: 2, title: 'Pista 2 - Sintonía Trabajo', artist: 'Daniel Esteve', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3' },
      { id: 3, title: 'Pista 3 - Ambient Chill', artist: 'Daniel Esteve', src: 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3' }
    ];

    const HardDriveIcon = () => e('svg', { width: '32', height: '32', viewBox: '0 0 36 36', fill: 'none' },
      e('rect', { x: '4', y: '10', width: '28', height: '16', rx: '2', fill: '#94a3b8', stroke: '#334155', strokeWidth: '1.5' }),
      e('rect', { x: '6', y: '12', width: '24', height: '12', rx: '1', fill: '#cbd5e1' }),
      e('circle', { cx: '9', cy: '18', r: '1.5', fill: '#22c55e' }),
      e('rect', { x: '13', y: '16', width: '14', height: '4', fill: '#64748b', rx: '0.5' })
    );

    const CdDriveIcon = () => e('svg', { width: '32', height: '32', viewBox: '0 0 36 36', fill: 'none' },
      e('rect', { x: '3', y: '11', width: '30', height: '14', rx: '2', fill: '#cbd5e1', stroke: '#475569', strokeWidth: '1.5' }),
      e('rect', { x: '6', y: '15', width: '24', height: '3', fill: '#94a3b8' }),
      e('circle', { cx: '27', cy: '21', r: '1', fill: '#3b82f6' }),
      e('rect', { x: '7', y: '20', width: '4', height: '2', fill: '#64748b' })
    );

    // COMPONENTE WINDOWS MEDIA PLAYER XP (DISEÑO FIEL XP)
    function MediaPlayerApp() {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [progress, setProgress] = useState(0);
      const [volume, setVolume] = useState(0.8);
      const audioRef = useRef(null);

      const currentTrack = playlist[currentIndex];

      useEffect(() => {
        if (audioRef.current) {
          audioRef.current.volume = volume;
        }
      }, [volume]);

      const togglePlay = () => {
        if (!audioRef.current) return;
        if (isPlaying) {
          audioRef.current.pause();
          setIsPlaying(false);
        } else {
          audioRef.current.play().then(() => {
            setIsPlaying(true);
          }).catch(err => console.log("Error al reproducir audio:", err));
        }
      };

      const handleTimeUpdate = () => {
        if (audioRef.current) {
          const current = audioRef.current.currentTime;
          const duration = audioRef.current.duration || 1;
          setProgress((current / duration) * 100);
        }
      };

      const handleEnded = () => {
        nextTrack();
      };

      const nextTrack = () => {
        setCurrentIndex((prev) => (prev + 1) % playlist.length);
        setIsPlaying(false);
        setProgress(0);
      };

      const prevTrack = () => {
        setCurrentIndex((prev) => (prev - 1 + playlist.length) % playlist.length);
        setIsPlaying(false);
        setProgress(0);
      };

      const selectTrack = (index) => {
        setCurrentIndex(index);
        setIsPlaying(false);
        setProgress(0);
      };

      const handleSeek = (evt) => {
        if (audioRef.current) {
          const rect = evt.currentTarget.getBoundingClientRect();
          const clickX = evt.clientX - rect.left;
          const width = rect.width;
          const duration = audioRef.current.duration || 0;
          audioRef.current.currentTime = (clickX / width) * duration;
        }
      };

      return e('div', { className: 'wmp-body flex flex-col h-full text-white p-2.5 rounded select-none gap-2.5 font-sans' },
        
        /* Audio HTML5 */
        e('audio', {
          ref: audioRef,
          src: currentTrack.src,
          onTimeUpdate: handleTimeUpdate,
          onEnded: handleEnded
        }),

        /* Encabezado del Media Player */
        e('div', { className: 'bg-gradient-to-r from-slate-900 via-blue-950 to-slate-900 px-3 py-1.5 rounded border border-blue-900/60 flex items-center justify-between text-xs' },
          e('div', { className: 'flex items-center gap-2' },
            e('img', { src: ICONS.mediaPlayer, className: 'w-4 h-4' }),
            e('span', { className: 'font-bold text-cyan-300 tracking-wide' }, 'Windows Media Player')
          ),
          e('span', { className: 'text-[10px] text-blue-400 font-mono' }, 'v8.00.00')
        ),

        /* Pantalla Pantalla de Reproducción con Visualizador Retro */
        e('div', { className: 'wmp-screen p-3 flex flex-col justify-between h-36 relative overflow-hidden rounded' },
          e('div', { className: 'flex justify-between items-center z-10 text-[11px] text-cyan-400 font-mono' },
            e('span', { className: 'flex items-center gap-1' },
              e('span', { className: `w-2 h-2 rounded-full ${isPlaying ? 'bg-green-400 animate-ping' : 'bg-amber-400'}` }),
              isPlaying ? 'REPRODUCIENDO' : 'PAUSADO'
            ),
            e('span', { className: 'text-slate-400' }, `[ Track 0${currentIndex + 1} ]`)
          ),

          /* Visualizador Gráfico de Onda / Ecualizador */
          e('div', { className: 'z-10 text-center my-auto relative' },
            e('p', { className: 'font-bold text-sm sm:text-base text-cyan-200 truncate drop-shadow' }, currentTrack.title),
            e('p', { className: 'text-xs text-blue-300/80 mt-0.5' }, currentTrack.artist),
            
            /* Barras del Ecualizador */
            e('div', { className: 'flex justify-center items-end gap-1 h-8 mt-2' },
              [40, 70, 30, 90, 60, 100, 50, 80, 40, 65, 85, 35].map((height, i) =>
                e('div', {
                  key: i,
                  style: { height: isPlaying ? `${Math.max(15, (height * (i % 3 + 1)) % 100)}%` : '15%' },
                  className: 'w-1.5 bg-gradient-to-t from-cyan-600 via-teal-400 to-green-300 rounded-t transition-all duration-300'
                })
              )
            )
          ),

          /* Barra de Tiempo */
          e('div', {
            onClick: handleSeek,
            className: 'w-full bg-slate-900 h-2.5 rounded cursor-pointer z-10 border border-slate-700 relative overflow-hidden'
          },
            e('div', { className: 'bg-gradient-to-r from-blue-600 via-cyan-400 to-teal-300 h-full transition-all duration-100', style: { width: `${progress}%` } })
          )
        ),

        /* Panel de Controles Metálicos de Windows XP */
        e('div', { className: 'bg-gradient-to-b from-slate-800 to-slate-950 p-2.5 border border-slate-700 rounded-lg flex flex-col gap-2 shadow-inner' },
          e('div', { className: 'flex items-center justify-between' },
            
            /* Controles Izquierda */
            e('div', { className: 'flex items-center gap-2' },
              e('button', {
                onClick: prevTrack,
                title: 'Anterior',
                className: 'w-8 h-8 rounded-full bg-slate-700 hover:bg-slate-600 active:scale-95 text-white border border-slate-500 flex items-center justify-center font-bold text-xs shadow'
              }, '⏮'),

              e('button', {
                onClick: togglePlay,
                title: isPlaying ? 'Pausar' : 'Reproducir',
                className: 'w-10 h-10 rounded-full wmp-btn-main active:scale-95 text-white flex items-center justify-center font-bold text-sm text-shadow cursor-pointer'
              }, isPlaying ? '❚❚' : '►'),

              e('button', {
                onClick: nextTrack,
                title: 'Siguiente',
                className: 'w-8 h-8 rounded-full bg-slate-700 hover:bg-slate-600 active:scale-95 text-white border border-slate-500 flex items-center justify-center font-bold text-xs shadow'
              }, '⏭')
            ),

            /* Control de Volumen */
            e('div', { className: 'flex items-center gap-1.5 text-xs text-slate-300 bg-slate-900/80 px-2.5 py-1 rounded-full border border-slate-800' },
              e('span', {}, '🔊'),
              e('input', {
                type: 'range',
                min: '0',
                max: '1',
                step: '0.05',
                value: volume,
                onChange: (evt) => setVolume(parseFloat(evt.target.value)),
                className: 'w-20 accent-cyan-400 cursor-pointer'
              })
            )
          )
        ),

        /* Lista de Reproducción Estilo XP */
        e('div', { className: 'flex-1 bg-slate-950 border border-slate-800 rounded p-2 overflow-y-auto max-h-[130px]' },
          e('div', { className: 'flex justify-between items-center text-[11px] font-bold text-cyan-400 mb-1.5 border-b border-slate-800 pb-1' },
            e('span', {}, '📋 Lista de Reproducción'),
            e('span', { className: 'text-slate-500 font-mono text-[10px]' }, `${playlist.length} canciones`)
          ),
          playlist.map((track, idx) =>
            e('div', {
              key: track.id,
              onClick: () => selectTrack(idx),
              className: `p-1.5 rounded text-xs cursor-pointer flex items-center justify-between transition ${idx === currentIndex ? 'bg-blue-900/70 text-cyan-200 font-bold border border-blue-600' : 'hover:bg-slate-900 text-slate-300'}`
            },
              e('div', { className: 'flex items-center gap-2 truncate' },
                e('span', { className: 'text-[10px] text-slate-500 font-mono' }, `0${idx + 1}.`),
                e('span', { className: 'truncate' }, track.title)
              ),
              idx === currentIndex && isPlaying && e('span', { className: 'text-[10px] text-cyan-400 animate-pulse shrink-0' }, '♫ sonando')
            )
          )
        )
      );
    }

    // COMPONENTE PAINT FUNCIONAL
    function PaintApp() {
      const canvasRef = useRef(null);
      const [isDrawing, setIsDrawing] = useState(false);
      const [color, setColor] = useState('#000000');
      const [tool, setTool] = useState('pencil');
      const [lineWidth, setLineWidth] = useState(3);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }, []);

      const startDrawing = (evt) => {
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
        const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;

        const ctx = canvas.getContext('2d');
        ctx.beginPath();
        ctx.moveTo(clientX - rect.left, clientY - rect.top);
        setIsDrawing(true);
      };

      const draw = (evt) => {
        if (!isDrawing) return;
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
        const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;

        const ctx = canvas.getContext('2d');
        ctx.lineTo(clientX - rect.left, clientY - rect.top);
        ctx.strokeStyle = tool === 'eraser' ? '#ffffff' : color;
        ctx.lineWidth = tool === 'eraser' ? lineWidth * 4 : lineWidth;
        ctx.lineCap = 'round';
        ctx.stroke();
      };

      const stopDrawing = () => {
        setIsDrawing(false);
      };

      const clearCanvas = () => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      };

      const downloadImage = () => {
        const canvas = canvasRef.current;
        const link = document.createElement('a');
        link.download = 'Mi-Dibujo-Paint.png';
        link.href = canvas.toDataURL();
        link.click();
      };

      const palette = [
        '#000000', '#808080', '#800000', '#808000', '#008000', '#008080', '#000080', '#800080',
        '#ffffff', '#c0c0c0', '#ff0000', '#ffff00', '#00ff00', '#00ffff', '#0000ff', '#ff00ff'
      ];

      return e('div', { className: 'flex flex-col h-full bg-slate-200 p-1.5 gap-2 select-none' },
        e('div', { className: 'flex flex-wrap items-center justify-between gap-2 bg-slate-100 p-1.5 border border-slate-300 rounded text-xs' },
          e('div', { className: 'flex items-center gap-1' },
            e('button', {
              onClick: () => setTool('pencil'),
              className: `px-2 py-1 rounded font-bold border ${tool === 'pencil' ? 'bg-blue-600 text-white border-blue-800' : 'bg-white text-slate-800 border-slate-300'}`
            }, '✏️ Lápiz'),
            e('button', {
              onClick: () => setTool('eraser'),
              className: `px-2 py-1 rounded font-bold border ${tool === 'eraser' ? 'bg-blue-600 text-white border-blue-800' : 'bg-white text-slate-800 border-slate-300'}`
            }, '🧹 Goma'),
            e('button', {
              onClick: clearCanvas,
              className: 'px-2 py-1 bg-white hover:bg-red-50 border border-slate-300 rounded font-bold text-red-600'
            }, '🗑️ Limpiar')
          ),

          e('div', { className: 'flex items-center gap-1 overflow-x-auto' },
            palette.map((c, i) => e('div', {
              key: i,
              onClick: () => { setColor(c); setTool('pencil'); },
              style: { backgroundColor: c },
              className: `w-5 h-5 rounded cursor-pointer border border-slate-400 ${color === c && tool === 'pencil' ? 'ring-2 ring-blue-500 scale-110' : ''}`
            }))
          ),

          e('div', { className: 'flex items-center gap-2' },
            e('select', {
              value: lineWidth,
              onChange: (evt) => setLineWidth(Number(evt.target.value)),
              className: 'bg-white border border-slate-300 rounded px-1 py-0.5 text-xs'
            },
              e('option', { value: 1 }, 'Fino'),
              e('option', { value: 3 }, 'Normal'),
              e('option', { value: 6 }, 'Grueso')
            ),
            e('button', {
              onClick: downloadImage,
              className: 'bg-green-600 hover:bg-green-700 text-white font-bold px-2 py-1 rounded text-xs shadow'
            }, '💾 Guardar')
          )
        ),

        e('div', { className: 'flex-1 bg-slate-300 p-1 border border-slate-400 flex items-center justify-center overflow-hidden rounded' },
          e('canvas', {
            ref: canvasRef,
            width: 600,
            height: 380,
            onMouseDown: startDrawing,
            onMouseMove: draw,
            onMouseUp: stopDrawing,
            onMouseLeave: stopDrawing,
            onTouchStart: startDrawing,
            onTouchMove: draw,
            onTouchEnd: stopDrawing,
            className: 'bg-white cursor-crosshair border border-slate-400 shadow-md max-w-full max-h-full touch-none'
          })
        )
      );
    }

    // COMPONENTE BUSCAMINAS FUNCIONAL
    function MinesweeperApp() {
      const ROWS = 8;
      const COLS = 8;
      const MINES = 10;

      const [grid, setGrid] = useState([]);
      const [gameOver, setGameOver] = useState(false);
      const [win, setWin] = useState(false);
      const [flags, setFlags] = useState(0);
      const [timer, setTimer] = useState(0);
      const [mode, setMode] = useState('reveal');
      const timerRef = useRef(null);

      const initGame = () => {
        clearInterval(timerRef.current);
        setTimer(0);
        setGameOver(false);
        setWin(false);
        setFlags(0);

        let newGrid = Array(ROWS).fill(null).map(() =>
          Array(COLS).fill(null).map(() => ({
            isMine: false,
            revealed: false,
            flagged: false,
            neighborMines: 0
          }))
        );

        let placedMines = 0;
        while (placedMines < MINES) {
          let r = Math.floor(Math.random() * ROWS);
          let c = Math.floor(Math.random() * COLS);
          if (!newGrid[r][c].isMine) {
            newGrid[r][c].isMine = true;
            placedMines++;
          }
        }

        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (!newGrid[r][c].isMine) {
              let count = 0;
              for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                  let nr = r + dr;
                  let nc = c + dc;
                  if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && newGrid[nr][nc].isMine) {
                    count++;
                  }
                }
              }
              newGrid[r][c].neighborMines = count;
            }
          }
        }

        setGrid(newGrid);
      };

      useEffect(() => {
        initGame();
        return () => clearInterval(timerRef.current);
      }, []);

      useEffect(() => {
        if (!gameOver && !win && grid.length > 0) {
          const hasRevealed = grid.some(row => row.some(cell => cell.revealed));
          if (hasRevealed) {
            timerRef.current = setInterval(() => {
              setTimer(t => t + 1);
            }, 1000);
            return () => clearInterval(timerRef.current);
          }
        }
      }, [grid, gameOver, win]);

      const revealCell = (r, c) => {
        if (gameOver || win || grid[r][c].revealed || grid[r][c].flagged) return;

        let newGrid = grid.map(row => row.map(cell => ({ ...cell })));

        if (newGrid[r][c].isMine) {
          for (let i = 0; i < ROWS; i++) {
            for (let j = 0; j < COLS; j++) {
              if (newGrid[i][j].isMine) newGrid[i][j].revealed = true;
            }
          }
          setGrid(newGrid);
          setGameOver(true);
          clearInterval(timerRef.current);
          return;
        }

        const floodFill = (row, col) => {
          if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return;
          if (newGrid[row][col].revealed || newGrid[row][col].flagged) return;

          newGrid[row][col].revealed = true;

          if (newGrid[row][col].neighborMines === 0) {
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                if (dr !== 0 || dc !== 0) floodFill(row + dr, col + dc);
              }
            }
          }
        };

        floodFill(r, c);
        setGrid(newGrid);

        let unrevealedSafeCells = 0;
        for (let i = 0; i < ROWS; i++) {
          for (let j = 0; j < COLS; j++) {
            if (!newGrid[i][j].isMine && !newGrid[i][j].revealed) unrevealedSafeCells++;
          }
        }

        if (unrevealedSafeCells === 0) {
          setWin(true);
          clearInterval(timerRef.current);
        }
      };

      const toggleFlag = (r, c, evt) => {
        if (evt) evt.preventDefault();
        if (gameOver || win || grid[r][c].revealed) return;

        let newGrid = grid.map(row => row.map(cell => ({ ...cell })));
        const currentFlagged = newGrid[r][c].flagged;

        newGrid[r][c].flagged = !currentFlagged;
        setFlags(prev => currentFlagged ? prev - 1 : prev + 1);
        setGrid(newGrid);
      };

      const handleCellClick = (r, c) => {
        if (mode === 'flag') {
          toggleFlag(r, c);
        } else {
          revealCell(r, c);
        }
      };

                }, content);
              })
            )
          )
        )
      );

            Object.entries(windows).map(([id, win]) => {

              const isActive = activeWin === id && !win.isMinimized;

                key: id,
                onClick: () => {
                  if (win.isMinimized || activeWin !== id) focusWindow(id);
                  else toggleMinimize(id);
                },
                className: `h-7 px-2 sm:px-3 rounded text-xs font-semibold flex items-center gap-1 border max-w-[110px] sm:max-w-[150px] truncate shrink-0 ${
                  isActive
                    ? 'bg-blue-800 text-white border-blue-900 shadow-inner'
                    : 'bg-blue-500/40 text-blue-100 border-blue-400/40 hover:bg-blue-500/60'

                win.iconSrc ? e('img', { src: win.iconSrc, className: 'w-3.5 h-3.5' }) : e('span', {}, '📎'),
