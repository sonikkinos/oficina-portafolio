    .xp-window {

      border: 3px solid #0055ea;
      border-radius: 8px 8px 0 0;
    }
    
    .xp-titlebar {
      background: linear-gradient(to bottom, #0058ee 0%, #388cf8 10%, #0055ea 88%, #0011bb 100%);

    }

    .xp-ctrl-btn {

      align-items: center;

      border-radius: 3px;
      cursor: pointer;
      border: 1px solid #102a75;
      box-shadow: inset 1px 1px 1px rgba(255,255,255,0.7);
    }

      background: linear-gradient(to bottom, #3c82f8 0%, #2968db 50%, #1748a8 100%);

    }

    .xp-start-btn {

      box-shadow: inset 1px 1px 2px #a5d6a7, inset -1px -1px 2px #1b5e20;

    .wmp8-bg { background: #091322; color: #c0d8f0; }

    function MediaPlayer8App() {
      const [currentIndex, setCurrentIndex] = useState(0);
      const [isPlaying, setIsPlaying] = useState(false);
      const [progress, setProgress] = useState(0);
      const [volume, setVolume] = useState(0.8);
      const [showPlaylist, setShowPlaylist] = useState(false);
      const audioRef = useRef(null);

      const currentTrack = playlist[currentIndex];

      useEffect(() => { if (audioRef.current) audioRef.current.volume = volume; }, [volume]);

      const togglePlay = () => {
        if (!audioRef.current) return;
        if (isPlaying) { audioRef.current.pause(); setIsPlaying(false); }
        else { audioRef.current.play().then(() => setIsPlaying(true)).catch(err => console.log(err)); }
      };

      const stopPlay = () => {
        if (!audioRef.current) return;
        audioRef.current.pause(); audioRef.current.currentTime = 0; setIsPlaying(false); setProgress(0);
      };

      const handleTimeUpdate = () => {
        if (audioRef.current) setProgress((audioRef.current.currentTime / (audioRef.current.duration || 1)) * 100);
      };

      const nextTrack = () => { setCurrentIndex((prev) => (prev + 1) % playlist.length); setIsPlaying(false); setProgress(0); };
      const prevTrack = () => { setCurrentIndex((prev) => (prev - 1 + playlist.length) % playlist.length); setIsPlaying(false); setProgress(0); };

      const handleSeek = (evt) => {
        if (audioRef.current) {
          const rect = evt.currentTarget.getBoundingClientRect();
          audioRef.current.currentTime = ((evt.clientX - rect.left) / rect.width) * (audioRef.current.duration || 0);
        }
      };

      return e('div', { className: 'wmp8-bg flex flex-col h-full w-full select-none text-xs font-sans overflow-hidden border border-slate-800' },
        e('audio', { ref: audioRef, src: currentTrack.src, onTimeUpdate: handleTimeUpdate, onEnded: nextTrack }),
        e('div', { className: 'flex flex-1 overflow-hidden relative' },
          e('div', { className: 'hidden sm:flex w-32 sm:w-36 flex-col shrink-0 text-[11px]' },
            [
              { id: 'nowPlaying', label: 'Now Playing', icon: '▶' },
              { id: 'mediaGuide', label: 'Media Guide', icon: '🌐' },

                e('span', { className: 'truncate' }, tab.label)

          e('div', { className: 'flex-1 flex flex-col sm:flex-row bg-black overflow-hidden relative' },

                e('span', {}, 'WMP v8.0'),
                e('button', { onClick: () => setShowPlaylist(!showPlaylist), className: 'bg-blue-900/80 text-cyan-200 px-2 py-1 rounded border border-blue-600 text-[10px]' }, showPlaylist ? '✕ Cerrar' : '📂 Playlist')
              ),
              e('div', { className: 'my-auto flex flex-col items-center text-center z-10 w-full px-1' },
                e('div', { className: 'w-20 h-20 sm:w-28 sm:h-28 rounded-full border-2 border-cyan-500/50 bg-radial from-cyan-900 via-blue-950 to-black flex items-center justify-center shadow-[0_0_20px_rgba(0,170,255,0.4)] mb-2 relative' },

    function PaintApp() {
      const canvasRef = useRef(null);
      const [isDrawing, setIsDrawing] = useState(false);
      const [color, setColor] = useState('#000000');
      const [tool, setTool] = useState('pencil');
      const [lineWidth, setLineWidth] = useState(3);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }, []);

      const startDrawing = (evt) => {
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
        const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
        const ctx = canvas.getContext('2d');
        ctx.beginPath();
        ctx.moveTo(clientX - rect.left, clientY - rect.top);
        setIsDrawing(true);
      };

      const draw = (evt) => {
        if (!isDrawing) return;
        const canvas = canvasRef.current;
        const rect = canvas.getBoundingClientRect();
        const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
        const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
        const ctx = canvas.getContext('2d');
        ctx.lineTo(clientX - rect.left, clientY - rect.top);
        ctx.strokeStyle = tool === 'eraser' ? '#ffffff' : color;
        ctx.lineWidth = tool === 'eraser' ? lineWidth * 4 : lineWidth;
        ctx.lineCap = 'round';
        ctx.stroke();
      };

      const stopDrawing = () => setIsDrawing(false);

      const clearCanvas = () => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      };

      const downloadImage = () => {
        const canvas = canvasRef.current;
        const link = document.createElement('a');
        link.download = 'Mi-Dibujo-Paint.png';
        link.href = canvas.toDataURL();
        link.click();
      };

      const palette = ['#000000', '#808080', '#800000', '#808000', '#008000', '#008080', '#000080', '#800080', '#ffffff', '#c0c0c0', '#ff0000', '#ffff00', '#00ff00', '#00ffff', '#0000ff', '#ff00ff'];

      return e('div', { className: 'flex flex-col h-full bg-slate-200 p-1.5 gap-2 select-none' },
        e('div', { className: 'flex flex-wrap items-center justify-between gap-2 bg-slate-100 p-1.5 border border-slate-300 rounded text-xs' },
          e('div', { className: 'flex items-center gap-1' },
            e('button', { onClick: () => setTool('pencil'), className: `px-2 py-1 rounded font-bold border ${tool === 'pencil' ? 'bg-blue-600 text-white' : 'bg-white text-slate-800'}` }, '✏️ Lápiz'),
            e('button', { onClick: () => setTool('eraser'), className: `px-2 py-1 rounded font-bold border ${tool === 'eraser' ? 'bg-blue-600 text-white' : 'bg-white text-slate-800'}` }, '🧹 Goma'),
            e('button', { onClick: clearCanvas, className: 'px-2 py-1 bg-white hover:bg-red-50 border rounded font-bold text-red-600' }, '🗑️ Limpiar')
          ),
          e('div', { className: 'flex items-center gap-1 overflow-x-auto' },
            palette.map((c, i) => e('div', {

    function MinesweeperApp() {
      const ROWS = 8;
      const COLS = 8;
      const MINES = 10;
      const [grid, setGrid] = useState([]);
      const [gameOver, setGameOver] = useState(false);
      const [win, setWin] = useState(false);
      const [flags, setFlags] = useState(0);
      const [timer, setTimer] = useState(0);
      const [mode, setMode] = useState('reveal');
      const timerRef = useRef(null);

      const initGame = () => {
        clearInterval(timerRef.current);
        setTimer(0); setGameOver(false); setWin(false); setFlags(0);
        let newGrid = Array(ROWS).fill(null).map(() =>
          Array(COLS).fill(null).map(() => ({ isMine: false, revealed: false, flagged: false, neighborMines: 0 }))
        );
        let placedMines = 0;
        while (placedMines < MINES) {
          let r = Math.floor(Math.random() * ROWS);
          let c = Math.floor(Math.random() * COLS);
          if (!newGrid[r][c].isMine) { newGrid[r][c].isMine = true; placedMines++; }
        }
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) {
            if (!newGrid[r][c].isMine) {
              let count = 0;
              for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                  let nr = r + dr; let nc = c + dc;
                  if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && newGrid[nr][nc].isMine) count++;
                }
              }
              newGrid[r][c].neighborMines = count;
            }
          }
        }
        setGrid(newGrid);
      };

      useEffect(() => { initGame(); return () => clearInterval(timerRef.current); }, []);

      useEffect(() => {
        if (!gameOver && !win && grid.length > 0) {
          const hasRevealed = grid.some(row => row.some(cell => cell.revealed));
          if (hasRevealed) {
            timerRef.current = setInterval(() => setTimer(t => t + 1), 1000);
            return () => clearInterval(timerRef.current);
          }
        }
      }, [grid, gameOver, win]);

      const revealCell = (r, c) => {
        if (gameOver || win || grid[r][c].revealed || grid[r][c].flagged) return;
        let newGrid = grid.map(row => row.map(cell => ({ ...cell })));
        if (newGrid[r][c].isMine) {
          for (let i = 0; i < ROWS; i++) {
            for (let j = 0; j < COLS; j++) { if (newGrid[i][j].isMine) newGrid[i][j].revealed = true; }
          }
          setGrid(newGrid); setGameOver(true); clearInterval(timerRef.current); return;
        }
        const floodFill = (row, col) => {
          if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return;
          if (newGrid[row][col].revealed || newGrid[row][col].flagged) return;
          newGrid[row][col].revealed = true;
          if (newGrid[row][col].neighborMines === 0) {
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) { if (dr !== 0 || dc !== 0) floodFill(row + dr, col + dc); }
            }
          }
        };
        floodFill(r, c); setGrid(newGrid);
        let unrevealedSafeCells = 0;
        for (let i = 0; i < ROWS; i++) {
          for (let j = 0; j < COLS; j++) { if (!newGrid[i][j].isMine && !newGrid[i][j].revealed) unrevealedSafeCells++; }
        }
        if (unrevealedSafeCells === 0) { setWin(true); clearInterval(timerRef.current); }
      };

      const toggleFlag = (r, c, evt) => {
        if (evt) evt.preventDefault();
        if (gameOver || win || grid[r][c].revealed) return;
        let newGrid = grid.map(row => row.map(cell => ({ ...cell })));
        const currentFlagged = newGrid[r][c].flagged;
        newGrid[r][c].flagged = !currentFlagged;
        setFlags(prev => currentFlagged ? prev - 1 : prev + 1); setGrid(newGrid);
      };

      const numberColors = ['', 'text-blue-600', 'text-green-700', 'text-red-600', 'text-blue-900', 'text-red-800', 'text-teal-600', 'text-black', 'text-gray-600'];

      return e('div', { className: 'flex flex-col items-center bg-slate-300 p-3 border-2 border-slate-100 shadow-inner select-none h-full justify-center' },
        e('div', { className: 'bg-slate-300 border-2 border-slate-500 border-b-white border-r-white p-2 w-full max-w-[260px] flex justify-between items-center mb-3' },
          e('div', { className: 'bg-black text-red-600 font-mono text-lg font-bold px-2 py-0.5 border border-slate-600 rounded' }, String(Math.max(0, MINES - flags)).padStart(3, '0')),
          e('button', { onClick: initGame, className: 'w-9 h-9 text-xl bg-slate-200 border-2 border-white border-b-slate-600 border-r-slate-600 flex items-center justify-center rounded shadow-xs' }, gameOver ? '😵' : win ? '😎' : '😀'),
          e('div', { className: 'bg-black text-red-600 font-mono text-lg font-bold px-2 py-0.5 border border-slate-600 rounded' }, String(Math.min(999, timer)).padStart(3, '0'))
        ),
        e('div', { className: 'flex gap-2 mb-2 text-xs font-bold' },
          e('button', { onClick: () => setMode('reveal'), className: `px-3 py-1 rounded border ${mode === 'reveal' ? 'bg-blue-600 text-white' : 'bg-white text-slate-800'}` }, '💣 Descubrir'),
          e('button', { onClick: () => setMode('flag'), className: `px-3 py-1 rounded border ${mode === 'flag' ? 'bg-red-600 text-white' : 'bg-white text-slate-800'}` }, '🚩 Banderas')
        ),
        e('div', { className: 'border-3 border-slate-500 p-1 bg-slate-400 rounded-sm' },
          e('div', { className: 'grid grid-cols-8 gap-0.5 bg-slate-500' },
            grid.map((row, r) =>
              row.map((cell, c) => {
                let content = '';
                let cellStyle = 'bg-slate-200 border-2 border-white border-b-slate-600 border-r-slate-600 active:border-slate-500';
                if (cell.revealed) {
                  cellStyle = 'bg-slate-300 border border-slate-400';
                  if (cell.isMine) { content = '💣'; cellStyle += ' bg-red-500'; }
                  else if (cell.neighborMines > 0) { content = e('span', { className: `font-extrabold ${numberColors[cell.neighborMines]}` }, cell.neighborMines); }
                } else if (cell.flagged) { content = '🚩'; }
                return e('button', {
                  key: `${r}-${c}`,
                  onClick: () => mode === 'flag' ? toggleFlag(r, c) : revealCell(r, c),
                  onContextMenu: (evt) => toggleFlag(r, c, evt),
                  className: `w-8 h-8 flex items-center justify-center font-bold text-sm leading-none ${cellStyle}`
                }, content);
              })
            )
          )
        )
      );
    }
